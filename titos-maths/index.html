lt|soft|solid) as easy is to (fun|straightforward|awful).",["difficult","straightforward"],"Hard means difficult; easy means straightforward."],[8,"Page is to (bride|pin|book) as website is to (internet|market|friend).",["book","internet"],"A page is part of a book; a website is part of the internet."],[9,"Fur is to (soft|warm|cat) as wool is to (sheep|pig|cold).",["cat","sheep"],"Fur grows on a cat; wool grows on a sheep."],[10,"Present is to (birthday|here|forget) as absent is to (school|Easter|away).",["here","away"],"Present means here; absent means away."],[11,"Eight is to (dog|fish|spider) as four is to (pig|chicken|wish).",["spider","pig"],"A spider has eight legs; a pig has four."],[12,"City is to (shop|walk|big) as village is to (small|flat|pretty).",["big","small"],"A city is big; a village is small."],[13,"Flower is to (bee|fragrance|petal) as tree is to (leaf|climb|green).",["petal","leaf"],"A flower has petals; a tree has leaves."],[14,"King is to (crown|castle|prince) as queen is to (frog|princess|fairy).",["prince","princess"],"A king's son is a prince; a queen's daughter is a princess."],[15,"Winter is to (cold|snow|Christmas) as summer is to (beach|school|sun).",["snow","sun"],"Snow is winter weather; sun is summer weather.",1],[16,"Read is to (calendar|future|book) as watch is to (film|clock|wrist).",["book","film"],"You read a book and watch a film."],[17,"Frog is to (hop|croak|green) as sparrow is to (garden|feather|fly).",["hop","fly"],"A frog moves by hopping; a sparrow moves by flying."],[18,"First is to (win|cheer|gold) as third is to (next|bronze|silver).",["gold","bronze"],"First place wins gold; third place wins bronze."]]},{"id":"vr23","page":23,"title":"Reorder Words to Make a Sentence","instr":"Find the two words that should be swapped for each sentence to make sense. Tap both words.","example":"I enjoy playing TOM with TENNIS.","tip":"Read the sentence out loud to work out which words have been swapped.","k":"pick2","qs":[[1,"Season is my favourite winter.",["Season","winter"],"Winter is my favourite season."],[2,"I school to rode on a rhino.",["school","rode"],"I rode to school on a rhino."],[3,"Book this read for your homework tonight.",["Book","read"],"Read this book for your homework tonight."],[4,"Look both ways when you road the cross.",["road","cross"],"Look both ways when you cross the road."],[5,"Maths and subjects are my favourite Science.",["subjects","Science"],"Maths and Science are my favourite subjects."],[6,"The wooden darted under the cat table.",["wooden","cat"],"The cat darted under the wooden table."],[7,"We went France in camping last summer.",["France","camping"],"We went camping in France last summer."],[8,"Put on your shoes before your socks.",["shoes","socks"],"Put on your socks before your shoes."],[9,"The blue flag is French, white and red.",["blue","French"],"The French flag is blue, white and red."],[10,"The ogre red on a munched apple.",["red","munched"],"The ogre munched on a red apple."],[11,"Africa come from mongooses.",["Africa","mongooses"],"Mongooses come from Africa."],[12,"The whistle blew his referee at full-time.",["whistle","referee"],"The referee blew his whistle at full-time."],[13,"We won't station it to the make on time.",["station","make"],"We won't make it to the station on time."],[14,"The circus opens night tomorrow.",["night","tomorrow"],"The circus opens tomorrow night."],[15,"The barge sailed gracefully canal the down.",["canal","down"],"The barge sailed gracefully down the canal."],[16,"Gemma early up got to go toe-wrestling.",["early","got"],"Gemma got up early to go toe-wrestling."],[17,"Bus I'm taking the tomorrow to school.",["Bus","tomorrow"],"I'm taking the bus tomorrow to school."],[18,"The postman bag his carried of letters.",["bag","carried"],"The postman carried his bag of letters."]]},{"id":"vr24","page":24,"title":"Related Words","instr":"The words in the grid form groups of related words. Tap the word that best completes the grid.","example":"far / close, fair / ?, found / lost → UNFAIR (each bottom word is the opposite of the one above)","tip":"Words can be linked across rows, down columns or across the whole grid, by meaning, sound or letter patterns.","k":"pick","qs":[[1,"Grid: donkey / work · monkey / business · busy / ? | job dog lazy order bee","bee","Each pair makes a phrase: donkey work, monkey business, busy bee."],[2,"Grid: defeat / beat · win / ? · argue / bicker | cheer grin worst lose triumph","triumph","Each bottom word means the same as the word above. Win = triumph."],[3,"Grid: gnawed / north · wriggle / ? · chemical / king | want move crown west rant","rant","Each bottom word starts with the same SOUND as the top word: gnawed sounds like 'n' (north), chemical like 'k' (king), wriggle like 'r' (rant)."],[4,"Grid: tinsel / shear · listen / hares · ? / share | learns stake sheep silent heard","silent","The top words are anagrams (tinsel, listen, silent) and so are the bottom words (shear, hares, share)."],[5,"Grid: ? / Japan · Rome / Italy · Paris / France | London Berlin Cairo Tokyo Athens","Tokyo","Capital cities above their countries. The capital of Japan is Tokyo."],[6,"Grid: extend / reach · endear / aches · earnest / ? | false hesitate hatch estimate honest","hesitate","Each word starts with the last three letters of the word before: extEND → ENDEAR → EARnest; reACH → ACHES → HESitate."],[7,"Grid: back / ? · foot / rest · ear / ring | gold forward fire yield sleep","fire","Each pair makes a compound word: footrest, earring, backfire."]]},{"id":"vr25","page":25,"title":"Rhyming Synonyms","instr":"The word on the left rhymes with a synonym of the missing word, but not the word itself. Tap the missing word.","example":"net | We sat on the ___ grass. → DAMP ('net' rhymes with 'wet', which means damp)","tip":"Rhyming words often use different spellings, e.g. 'say' and 'sleigh'.","k":"pick","qs":[[1,"save | The knight was ___ when he fought the dragon. | focused frightened violent agile daring","daring","save rhymes with brave, which means daring."],[2,"news | Milo wanted to ___ a stylish outfit. | design model select donate purchase","select","news rhymes with choose, which means select."],[3,"cried | Nadja decided to ___ the bag of sweets. | trade conceal discard consume gift","conceal","cried rhymes with hide, which means conceal."],[4,"forever | Joni's teacher said she was very ___. | resilient timid intelligent noisy respectful","intelligent","forever rhymes with clever, which means intelligent."],[5,"thumb | My brother said he was feeling ___. | gleeful miserable outraged agitated puzzled","miserable","thumb rhymes with glum, which means miserable."],[6,"resort | The police ___ the suspect. | released captured observed pursued visited","captured","resort rhymes with caught, which means captured."],[7,"tower | Haruki has the ___ of a thousand men. | protection strength friendship assistance riches","strength","tower rhymes with power, which means strength."],[8,"wrecked | The explorers needed to ___ the ancient artefact. | examine repair exhibit describe destroy","examine","wrecked rhymes with inspect, which means examine."],[9,"street | The new library in my town is ___. | orderly hectic tranquil enormous luxurious","orderly","street rhymes with neat, which means orderly."],[10,"hand | Visiting the abandoned mansion is ___. | petrifying crucial exhausting dangerous forbidden","forbidden","hand rhymes with banned, which means forbidden."]]},{"id":"vr26","page":26,"title":"Complete the Sum","instr":"Find the missing number to complete each sum.","example":"9 × 3 = ( 27 )","tip":"Work out the side you can finish first, then find the number that makes both sides equal.","k":"text","qs":[[1,"20 ÷ 5 = ( _ )",["4"],"20 ÷ 5 = 4"],[2,"22 ÷ 11 = ( _ )",["2"],"22 ÷ 11 = 2"],[3,"5 × 5 = ( _ )",["25"],"5 × 5 = 25"],[4,"8 + 13 = ( _ )",["21"],"8 + 13 = 21"],[5,"10 × 2 = 24 − ( _ )",["4"],"10 × 2 = 20, and 24 − 4 = 20"],[6,"15 ÷ 3 = 4 + ( _ )",["1"],"15 ÷ 3 = 5, and 4 + 1 = 5"],[7,"7 × 3 = 16 + ( _ )",["5"],"7 × 3 = 21, and 16 + 5 = 21"],[8,"26 ÷ 2 = 20 − ( _ )",["7"],"26 ÷ 2 = 13, and 20 − 7 = 13"],[9,"24 ÷ 3 = 4 × ( _ )",["2"],"24 ÷ 3 = 8, and 4 × 2 = 8"],[10,"18 ÷ 6 = 9 ÷ ( _ )",["3"],"18 ÷ 6 = 3, and 9 ÷ 3 = 3"],[11,"7 × 3 − 4 = ( _ )",["17"],"7 × 3 = 21, then 21 − 4 = 17"],[12,"10 ÷ 5 + 2 = ( _ )",["4"],"10 ÷ 5 = 2, then 2 + 2 = 4"],[13,"6 × 3 − 3 = ( _ )",["15"],"6 × 3 = 18, then 18 − 3 = 15"],[14,"8 × 4 = 5 × 5 + ( _ )",["7"],"8 × 4 = 32, and 5 × 5 = 25, so 25 + 7 = 32"],[15,"24 ÷ 3 × 5 = 4 × ( _ )",["10"],"24 ÷ 3 = 8, × 5 = 40, and 4 × 10 = 40"],[16,"15 × 2 ÷ 5 = ( _ ) − 6",["12"],"15 × 2 = 30, ÷ 5 = 6, and 12 − 6 = 6"],[17,"12 ÷ 4 = 20 ÷ 4 − ( _ )",["2"],"12 ÷ 4 = 3, and 20 ÷ 4 = 5, so 5 − 2 = 3"],[18,"25 ÷ 5 + 4 = 17 − ( _ )",["8"],"25 ÷ 5 + 4 = 9, and 17 − 8 = 9"]]},{"id":"vr27","page":27,"title":"Letter Sequences","instr":"Find the pair of letters that continues each sequence in the best way. Use the alphabet to help you.","example":"AB BC CD DE EF ( FG )","tip":"Look at the first letters on their own, then the second letters. Jot down whether each goes forwards or backwards, and by how many. After Z, go back to A.","alpha":1,"k":"text","qs":[[1,"CS CS DT DT EU ( _ )",["EU"],"Each pair appears twice, then both letters move on 1. EU comes again."],[2,"NF OE PD QC RB ( _ )",["SA"],"First letters go forward 1 (R → S); second letters go back 1 (B → A)."],[3,"CJ FM IP LS OV ( _ )",["RY"],"Both letters go forward 3: O → R, V → Y."],[4,"GR HT IV JX KZ ( _ )",["LB"],"First letters +1 (K → L); second letters +2 (Z → B, going round to the start)."],[5,"PE RG TI VK XM ( _ )",["ZO"],"Both letters go forward 2: X → Z, M → O."],[6,"CV YZ UD QH ML ( _ )",["IP"],"First letters go back 4 (M → I); second letters go forward 4 (L → P)."],[7,"BS DP FM HJ JG ( _ )",["LD"],"First letters +2 (J → L); second letters −3 (G → D)."],[8,"CA AE YI WM UQ ( _ )",["SU"],"First letters −2 (U → S); second letters +4 (Q → U)."],[9,"LL ON RP UR XT ( _ )",["AV"],"First letters +3 (X → A, going round); second letters +2 (T → V)."],[10,"US SP QM OJ MG ( _ )",["KD"],"First letters −2 (M → K); second letters −3 (G → D)."],[11,"ZV WS TT QQ NR ( _ )",["KO"],"First letters −3 (N → K); second letters go −3, +1, −3, +1, so next is −3 (R → O)."],[12,"CC DE FG GI IK ( _ )",["JM"],"First letters go +1, +2, +1, +2, so next is +1 (I → J); second letters +2 (K → M)."],[13,"FT GO LN MI RH ( _ )",["SC"],"First letters go +1, +5 in turn (R → S); second letters go −5, −1 in turn (H → C)."],[14,"KJ MH PE RC UZ ( _ )",["WX"],"First letters go +2, +3 in turn (U → W); second letters go −2, −3 in turn (Z → X)."],[15,"VJ TM SO QR PT ( _ )",["NW"],"First letters go −2, −1 in turn (P → N); second letters go +3, +2 in turn (T → W)."],[16,"AZ BV DR GN KJ ( _ )",["PF"],"First letters go +1, +2, +3, +4, so next is +5 (K → P); second letters −4 (J → F)."],[17,"EG GD JB LY OW ( _ )",["QT"],"First letters go +2, +3 in turn (O → Q); second letters go −3, −2 in turn (W → T)."],[18,"YF TF PG MI KL ( _ )",["JP"],"First letters go −5, −4, −3, −2, so next is −1 (K → J); second letters go +0, +1, +2, +3, so next is +4 (L → P)."]]},{"id":"vr28","page":28,"title":"Number Sequences","instr":"Find the number that continues each sequence in the best way.","example":"1 3 5 7 9 ( 11 )","tip":"Write the difference between each number. If there's no pattern, try every other number, or adding the two numbers before.","k":"text","qs":[[1,"5 10 15 20 25 ( _ )",["30"],"Add 5 each time: 25 + 5 = 30."],[2,"1 2 4 8 16 ( _ )",["32"],"Double each time: 16 × 2 = 32."],[3,"60 50 40 30 20 ( _ )",["10"],"Take away 10 each time."],[4,"7 14 21 28 35 ( _ )",["42"],"The 7 times table: 35 + 7 = 42."],[5,"1 4 5 9 14 ( _ )",["23"],"Add the two numbers before: 9 + 14 = 23."],[6,"8 12 12 16 16 ( _ )",["20"],"Each number appears twice, going up in 4s: 20 is next."],[7,"4 4 8 12 20 ( _ )",["32"],"Add the two numbers before: 12 + 20 = 32."],[8,"12 13 15 18 22 ( _ )",["27"],"Add 1, then 2, 3, 4, so next add 5: 22 + 5 = 27."],[9,"96 48 24 12 6 ( _ )",["3"],"Halve each time: 6 ÷ 2 = 3."],[10,"2 4 8 14 22 ( _ )",["32"],"Add 2, 4, 6, 8, so next add 10: 22 + 10 = 32."],[11,"1 10 2 15 3 20 ( _ )",["4"],"Two sequences take turns: 1, 2, 3 … and 10, 15, 20 … Next is 4."],[12,"9 8 8 9 11 ( _ )",["14"],"The changes go −1, 0, +1, +2, so next is +3: 11 + 3 = 14."],[13,"12 4 9 8 6 12 ( _ )",["3"],"Two sequences take turns: 12, 9, 6 … (−3) and 4, 8, 12 … Next is 3."],[14,"2 3 6 11 18 ( _ )",["27"],"Add 1, 3, 5, 7, so next add 9: 18 + 9 = 27."],[15,"41 32 24 17 11 ( _ )",["6"],"Take away 9, 8, 7, 6, so next take 5: 11 − 5 = 6."],[16,"2 2 4 12 ( _ )",["48"],"Multiply by 1, 2, 3, so next × 4: 12 × 4 = 48."],[17,"2 7 4 10 6 13 ( _ )",["8"],"Two sequences take turns: 2, 4, 6 … and 7, 10, 13 … Next is 8."],[18,"50 37 26 17 10 ( _ )",["5"],"Take away 13, 11, 9, 7, so next take 5: 10 − 5 = 5."]]},{"id":"vr29","page":29,"title":"Related Numbers","instr":"Find the number that completes the final set in the same way as the first two sets.","example":"6 (8) 2   5 (9) 4   10 ( 13 ) 3   (the outside numbers add up to the middle)","tip":"Ignore patterns between the three sets. Just work out how the two outside numbers make the middle one: add, take away, multiply, divide or halfway.","k":"text","qs":[[1,"2 (5) 3   4 (9) 5   5 ( _ ) 3",["8"],"Add the outside numbers: 5 + 3 = 8."],[2,"12 (9) 3   6 (5) 1   13 ( _ ) 5",["8"],"Take the right from the left: 13 − 5 = 8."],[3,"6 (15) 21   4 (17) 21   7 ( _ ) 12",["5"],"Take the left from the right: 12 − 7 = 5."],[4,"2 (7) 12   4 (9) 14   8 ( _ ) 18",["13"],"The middle is halfway between: 8 and 18 → 13."],[5,"2 (8) 6   6 (16) 10   10 ( _ ) 14",["24"],"Add the outside numbers: 10 + 14 = 24."],[6,"8 (4) 0   24 (20) 16   32 ( _ ) 24",["28"],"The middle is halfway between: 32 and 24 → 28."],[7,"2 (8) 4   5 (40) 8   4 ( _ ) 3",["12"],"Multiply the outside numbers: 4 × 3 = 12."],[8,"9 (9) 18   11 (9) 20   14 ( _ ) 23",["9"],"The difference: 23 − 14 = 9."],[9,"3 (2) 6   4 (3) 12   3 ( _ ) 9",["3"],"Divide the right by the left: 9 ÷ 3 = 3."],[10,"14 (20) 26   3 (7) 11   15 ( _ ) 21",["18"],"The middle is halfway between: 15 and 21 → 18."],[11,"2 (4) 2   4 (12) 3   2 ( _ ) 6",["12"],"Multiply the outside numbers: 2 × 6 = 12."],[12,"10 (5) 2   9 (3) 3   12 ( _ ) 4",["3"],"Divide the left by the right: 12 ÷ 4 = 3."],[13,"8 (11) 14   15 (21) 27   28 ( _ ) 36",["32"],"The middle is halfway between: 28 and 36 → 32."],[14,"6 (36) 6   4 (16) 4   3 ( _ ) 3",["9"],"Multiply the outside numbers: 3 × 3 = 9."],[15,"12 (4) 4   18 (7) 3   24 ( _ ) 6",["5"],"Divide the left by the right, then add 1: 24 ÷ 6 = 4, + 1 = 5."],[16,"2 (14) 5   4 (20) 6   2 ( _ ) 3",["10"],"Add the outside numbers, then double: (2 + 3) × 2 = 10."],[17,"10 (4) 2   8 (2) 4   20 ( _ ) 8",["6"],"Take the right from the left, then halve: (20 − 8) ÷ 2 = 6."],[18,"8 (12) 2   6 (4) 4   12 ( _ ) 4",["16"],"Take the right from the left, then double: (12 − 4) × 2 = 16."]]},{"id":"vr30","page":30,"title":"Letter-Coded Sums","instr":"Each letter stands for a number. Work out the answer to each sum, then write it as a LETTER.","example":"A=1 B=2 C=3 D=5 E=8   E − D = ( C )   because 8 − 5 = 3, and C = 3","tip":"Swap the letters for numbers, do the sum, then find which letter matches. Your answer must be a letter, not a number.","k":"text","qs":[[1,"A=1 B=3 C=5 D=7 E=10   D + B = ( _ )",["E"],"D + B = 7 + 3 = 10, which is E."],[2,"A=2 B=5 C=6 D=8 E=12   E ÷ A = ( _ )",["C"],"E ÷ A = 12 ÷ 2 = 6, which is C."],[3,"A=1 B=3 C=7 D=14 E=17   E − D = ( _ )",["B"],"E − D = 17 − 14 = 3, which is B."],[4,"A=3 B=5 C=7 D=15 E=24   B × A = ( _ )",["D"],"B × A = 5 × 3 = 15, which is D."],[5,"A=2 B=8 C=16 D=20 E=25   C ÷ A = ( _ )",["B"],"C ÷ A = 16 ÷ 2 = 8, which is B."],[6,"A=2 B=7 C=12 D=14 E=19   E − B + A = ( _ )",["D"],"19 − 7 + 2 = 14, which is D."],[7,"A=3 B=8 C=9 D=16 E=20   A + B + C = ( _ )",["E"],"3 + 8 + 9 = 20, which is E."],[8,"A=2 B=3 C=6 D=12 E=24   E ÷ B − C = ( _ )",["A"],"24 ÷ 3 = 8, then 8 − 6 = 2, which is A."],[9,"A=2 B=5 C=6 D=13 E=16   A × B + C = ( _ )",["E"],"2 × 5 = 10, then 10 + 6 = 16, which is E."],[10,"A=2 B=8 C=12 D=16 E=24   D × A − B = ( _ )",["E"],"16 × 2 = 32, then 32 − 8 = 24, which is E."],[11,"A=4 B=6 C=7 D=11 E=13   A × B − E = ( _ )",["D"],"4 × 6 = 24, then 24 − 13 = 11, which is D."],[12,"A=2 B=6 C=7 D=10 E=21   B × C ÷ E = ( _ )",["A"],"6 × 7 = 42, then 42 ÷ 21 = 2, which is A."],[13,"A=2 B=4 C=7 D=9 E=11   A × D − C − B = ( _ )",["C"],"2 × 9 = 18, − 7 = 11, − 4 = 7, which is C."],[14,"A=1 B=3 C=4 D=12 E=13   B ÷ A × C + A = ( _ )",["E"],"3 ÷ 1 = 3, × 4 = 12, + 1 = 13, which is E."],[15,"A=2 B=3 C=9 D=12 E=16   A × B + D − E = ( _ )",["A"],"2 × 3 = 6, + 12 = 18, − 16 = 2, which is A."]]},{"id":"vr31","page":31,"title":"Letter-Word Codes","instr":"Each question uses a different code. Use the alphabet to work out the answer.","example":"If the code for TOE is SND, what is the code for FIB? EHA (each letter goes back 1)","tip":"Count how far each letter moves. Look out for MIRROR codes: A↔Z, B↔Y, C↔X … M↔N.","alpha":1,"k":"text","qs":[[1,"If the code for FISH is GJTI, what is the code for TANK?",["UBOL"],"Each letter moves forward 1: T→U, A→B, N→O, K→L."],[2,"If the code for ROSE is QNRD, what is the code for BUSH?",["ATRG"],"Each letter moves back 1: B→A, U→T, S→R, H→G."],[3,"If the code for POST is NMQR, what is QJSE the code for?",["SLUG"],"The code moves each letter back 2, so go forward 2 to decode: Q→S, J→L, S→U, E→G."],[4,"If the code for STAR is VWDU, what is the code for MOON?",["PRRQ"],"Each letter moves forward 3: M→P, O→R, O→R, N→Q."],[5,"If the code for PINK is TMRO, what is FPYI the code for?",["BLUE"],"The code moves forward 4, so go back 4 to decode: F→B, P→L, Y→U, I→E."],[6,"If the code for METAL is LGSCK, what is the code for BRASS?",["ATZUR"],"The letters move −1, +2, −1, +2, −1: B→A, R→T, A→Z, S→U, S→R."],[7,"If the code for PHONE is SHRNH, what is the code for GHOUL?",["JHRUO"],"The letters move +3, 0, +3, 0, +3: G→J, H→H, O→R, U→U, L→O."],[8,"If the code for BROAD is DPQYF, what is UOWYV the code for?",["SQUAT"],"The code moves +2, −2, +2, −2, +2, so decode with −2, +2, −2, +2, −2: SQUAT."],[9,"If the code for ACE is ZXV, what is YZW the code for?",["BAD"],"A mirror code: A↔Z, C↔X, E↔V. So Y→B, Z→A, W→D."],[10,"If the code for JELLY is LHNOA, what is the code for CREAM?",["EUGDO"],"The letters move +2, +3, +2, +3, +2: C→E, R→U, E→G, A→D, M→O."],[11,"If the code for ZANY is AZMB, what is XZIW the code for?",["CARD"],"A mirror code: Z↔A, N↔M, Y↔B. So X→C, Z→A, I→R, W→D."],[12,"If the code for OTTER is OSRBN, what is MZPHO the code for?",["MARKS"],"The code moves 0, −1, −2, −3, −4, so decode with 0, +1, +2, +3, +4: MARKS."],[13,"If the code for CLASS is DJDOX, what is the code for TEACH?",["UCDYM"],"The letters move +1, −2, +3, −4, +5: T→U, E→C, A→D, C→Y, H→M."],[14,"If the code for BEND is YVMW, what is WIZD the code for?",["DRAW"],"A mirror code: B↔Y, E↔V, N↔M, D↔W. So W→D, I→R, Z→A, D→W."]]},{"id":"vr32","page":"32–33","title":"Number-Word Codes","instr":"The number codes for three of the four words are listed in a random order. Work out the code to answer the questions.","example":"Look for repeated letters: SEEK has a double E, so its code has a double number (3554).","tip":"Words that start with the same letter will start with the same number. Double letters give double numbers.","k":"text","qs":[[1,"Words: BARN ARID BIND BAND   Codes (3 of them, mixed up): 1536 5324 1564 | Find the code for the word BIND.",["1264"],"Match the codes using repeated letters first (a double letter means a double number). The code for BIND is 1264."],[2,"Words: BARN ARID BIND BAND   Codes (3 of them, mixed up): 1536 5324 1564 | Find the code for the word DRAB.",["4351"],"Match the codes using repeated letters first (a double letter means a double number). The code for DRAB is 4351."],[3,"Words: BARN ARID BIND BAND   Codes (3 of them, mixed up): 1536 5324 1564 | Find the word that has the number code 1356.",["BRAN"],"Decode each number with the letters you've worked out: 1356 = BRAN."],[4,"Words: TEAR FOOT FORE FEAT   Codes (3 of them, mixed up): 5112 5342 2346 | Find the code for the word TEAR.",["2346"],"Match the codes using repeated letters first (a double letter means a double number). The code for TEAR is 2346."],[5,"Words: TEAR FOOT FORE FEAT   Codes (3 of them, mixed up): 5112 5342 2346 | Find the code for the word TORE.",["2163"],"Match the codes using repeated letters first (a double letter means a double number). The code for TORE is 2163."],[6,"Words: TEAR FOOT FORE FEAT   Codes (3 of them, mixed up): 5112 5342 2346 | Find the word that has the number code 6452.",["RAFT"],"Decode each number with the letters you've worked out: 6452 = RAFT."],[7,"Words: SEEK SOAK MAKE ASKS   Codes (3 of them, mixed up): 3554 1645 3264 | Find the code for the word SOAK.",["3264"],"Match the codes using repeated letters first (a double letter means a double number). The code for SOAK is 3264."],[8,"Words: SEEK SOAK MAKE ASKS   Codes (3 of them, mixed up): 3554 1645 3264 | Find the code for the word SAME.",["3615"],"Match the codes using repeated letters first (a double letter means a double number). The code for SAME is 3615."],[9,"Words: SEEK SOAK MAKE ASKS   Codes (3 of them, mixed up): 3554 1645 3264 | Find the word that has the number code 1634.",["MASK"],"Decode each number with the letters you've worked out: 1634 = MASK."],[10,"Words: ARCH HAIR RACE HARE   Codes (3 of them, mixed up): 6231 5261 5246 | Find the code for the word RACE.",["6231"],"Match the codes using repeated letters first (a double letter means a double number). The code for RACE is 6231."],[11,"Words: ARCH HAIR RACE HARE   Codes (3 of them, mixed up): 6231 5261 5246 | Find the code for the word ACHE.",["2351"],"Match the codes using repeated letters first (a double letter means a double number). The code for ACHE is 2351."],[12,"Words: ARCH HAIR RACE HARE   Codes (3 of them, mixed up): 6231 5261 5246 | Find the word that has the number code 3261.",["CARE"],"Decode each number with the letters you've worked out: 3261 = CARE."],[13,"Words: LACK WEAK LEEK LAKE   Codes (3 of them, mixed up): 2564 1634 1554 | Find the code for the word LAKE.",["1645"],"Match the codes using repeated letters first (a double letter means a double number). The code for LAKE is 1645."],[14,"Words: LACK WEAK LEEK LAKE   Codes (3 of them, mixed up): 2564 1634 1554 | Find the code for the word CAKE.",["3645"],"Match the codes using repeated letters first (a double letter means a double number). The code for CAKE is 3645."],[15,"Words: LACK WEAK LEEK LAKE   Codes (3 of them, mixed up): 2564 1634 1554 | Find the word that has the number code 4551.",["KEEL"],"Decode each number with the letters you've worked out: 4551 = KEEL."],[16,"Words: BEEN ANEW NAME BANE   Codes (3 of them, mixed up): 1665 5326 3564 | Find the code for the word ANEW.",["3564"],"Match the codes using repeated letters first (a double letter means a double number). The code for ANEW is 3564."],[17,"Words: BEEN ANEW NAME BANE   Codes (3 of them, mixed up): 1665 5326 3564 | Find the code for the word MEAN.",["2635"],"Match the codes using repeated letters first (a double letter means a double number). The code for MEAN is 2635."],[18,"Words: BEEN ANEW NAME BANE   Codes (3 of them, mixed up): 1665 5326 3564 | Find the word that has the number code 4356.",["WANE"],"Decode each number with the letters you've worked out: 4356 = WANE."],[19,"Words: MOAN MEAN MENU OMEN   Codes (3 of them, mixed up): 3654 6314 6542 | Find the code for the word OMEN.",["3654"],"Match the codes using repeated letters first (a double letter means a double number). The code for OMEN is 3654."],[20,"Words: MOAN MEAN MENU OMEN   Codes (3 of them, mixed up): 3654 6314 6542 | Find the code for the word NAME.",["4165"],"Match the codes using repeated letters first (a double letter means a double number). The code for NAME is 4165."],[21,"Words: MOAN MEAN MENU OMEN   Codes (3 of them, mixed up): 3654 6314 6542 | Find the word that has the number code 4534.",["NEON"],"Decode each number with the letters you've worked out: 4534 = NEON."],[22,"Words: FOAL LOAF LATE TEAL   Codes (3 of them, mixed up): 5413 6213 3216 | Find the code for the word LATE.",["3154"],"Match the codes using repeated letters first (a double letter means a double number). The code for LATE is 3154."],[23,"Words: FOAL LOAF LATE TEAL   Codes (3 of them, mixed up): 5413 6213 3216 | Find the code for the word TALL.",["5133"],"Match the codes using repeated letters first (a double letter means a double number). The code for TALL is 5133."],[24,"Words: FOAL LOAF LATE TEAL   Codes (3 of them, mixed up): 5413 6213 3216 | Find the word that has the number code 6315.",["FLAT"],"Decode each number with the letters you've worked out: 6315 = FLAT."]]},{"id":"vr34","page":"34–35","title":"Explore the Facts","instr":"Read the information carefully, then use it to answer the question. Type the person's name.","example":"Make a quick list of each person and tick off what they do.","tip":"Some questions have lots of information. Write it in a grid on paper to help you.","k":"text","qs":[[1,"Jane, Debbie, Victoria, Lisa and Pierre all enjoy horse riding. Everyone except Victoria rides on Saturday. Pierre rides after school on Monday. Only Lisa and Victoria ride on Sunday morning. Lisa also rides on Wednesday. Who goes riding MOST often?",["Lisa"],"Lisa rides on Saturday, Sunday and Wednesday: 3 times. Nobody else rides more than twice."],[2,"Alice, Grace, Rana, Mark and William are all going on holiday this year. Grace and Rana are going on an activity holiday. Mark is going to Ireland. Alice is going to a hotel in France. Rana, Grace and Alice are going camping. William is going on a cycling holiday in Devon with Mark. Who is going on the FEWEST holidays?",["William"],"William only goes to Devon: 1 holiday. Everyone else has 2."],[3,"Haj, Jason, Georgia, Rosie and Lucy all like pizza, especially with unusual toppings. Everyone likes raisins, except Jason and Lucy. Jason's favourite topping is baked beans. Georgia and Haj eat lemon curd on their pizza. Lucy and Haj both like sausages. Who likes the MOST toppings on their pizza?",["Haj"],"Haj likes raisins, lemon curd and sausages: 3 toppings."],[4,"James, Edward, Ellie, Shreena and Alec are talking about their plans for the weekend. James, Edward and Ellie are all going swimming. Shreena and Alec are visiting family. Ellie and Shreena plan to go to the cinema. The boys are going shopping. Everyone except Edward plans to go to the park. Who has the FEWEST plans for the weekend?",["Edward"],"Edward only goes swimming and shopping: 2 plans. Everyone else has 3."],[5,"Marta, Jafar, Oliver, Poppy and Neal are all going on school trips this year. Oliver and Neal are going to an art gallery. Poppy, Marta and Jafar are going to the science museum and also on a school picnic. Oliver is going on a trip to France. Marta and Jafar are going to the theatre. Who is going to visit the FEWEST places?",["Neal"],"Neal only goes to the art gallery: 1 place."],[6,"Lee, Louise, Spencer, Emma and Kristina all had tests at school. Lee scored the highest in Maths. Emma scored the highest mark in Art. Kristina came top in French, but didn't do well in Maths. Spencer and Louise scored the highest marks in Science and Spencer was top in History. Who came top in the MOST subjects?",["Spencer"],"Spencer came top in Science and History: 2 subjects. Everyone else was top in 1."],[7,"Katya, Juan, Hannah, Wayne and Julia all go to swimming club. Juan goes swimming every day apart from Tuesday. Hannah and Julia swim every Wednesday. Hannah also swims on Saturday with Wayne. Katya goes swimming with Wayne every Sunday and Monday. Who swims the FEWEST number of days per week?",["Julia"],"Julia only swims on Wednesday: 1 day."],[8,"Callum, Maddie, Geeta, Charlie and Lin all have pets. Four of them have a dog. Maddie is the only one who has a pony. Geeta and Charlie have a hamster each. Callum also has a hamster, but he doesn't have a dog. They all have a pet cat, apart from Geeta and Charlie. Who has the MOST pets?",["Maddie"],"Everyone except Callum has a dog. Maddie has a dog, a pony and a cat: 3 pets."]]},{"id":"vr36","page":"36–37","title":"Solve the Riddle","instr":"Read the information carefully, then tap the correct answer.","example":"Put the people in order on paper, fastest to slowest or first to last.","tip":"Your answer MUST be true (or MUST be false). Don't choose an answer that only might be true.","k":"pick","qs":[[1,"Max, Charlotte, Ahmed and Victoria all attend a running club. Max runs faster than Charlotte. Victoria runs faster than Max. Ahmed is slower than Charlotte. Which sentence MUST be true? | A: Charlotte runs faster than Victoria. | B: Max runs faster than Victoria. | C: Ahmed is quicker than Victoria. | D: Max is the fastest runner. | E: Max runs faster than Ahmed.","E","Fastest to slowest: Victoria, Max, Charlotte, Ahmed. So Max must be faster than Ahmed."],[2,"Sophie, Karl, Daisy, Josh and Abbie are talking about their houses. Sophie lives in a house with three bedrooms. Karl and Daisy both live in houses with more bedrooms than Sophie. Abbie's house doesn't have a garden. Josh's house has half as many bedrooms as Karl's. Which sentence CANNOT be true? | A: Daisy lives in a house with four bedrooms. | B: Abbie's house is semi-detached. | C: Karl's house has five bedrooms. | D: Daisy's house is bigger than Abbie's. | E: Josh has his own bedroom.","C","Josh has half as many bedrooms as Karl. Half of 5 is 2½, and you can't have half a bedroom, so Karl can't have 5."],[3,"Laura, Georgia, Rohan and Jamie were all born in August. Georgia was born before Laura, but after Jamie. Rohan was born after Jamie. Which sentence MUST be true? | A: Laura is older than Georgia. | B: Georgia was born on the same day as Rohan. | C: Jamie was born after Georgia. | D: Laura is older than Rohan. | E: Jamie is the oldest.","E","Jamie was born before Georgia, Laura and Rohan, so Jamie is the oldest."],[4,"Last year, the average temperature in August was 2 degrees hotter than in June. The average temperature in June was 15 degrees Celsius. That was 7 degrees less than July's average. The coldest day in September was 8 degrees cooler than August's average. Which sentence CANNOT be true? | A: Average temperature in July was 22 degrees Celsius. | B: The coldest day in September was 9 degrees. | C: July was hotter than June. | D: July was cooler than August. | E: September was cooler than August.","D","June = 15°, August = 17°, July = 22°. July was hotter than August, so D can't be true."],[5,"Patrick, Angharad, Hannah, Jacob and Sushmita all need to catch buses to meet in town. Jacob's bus arrives 15 minutes after Hannah's bus. Sushmita's bus arrives 20 minutes before Angharad's. Patrick's bus arrives at 7.15pm. Hannah's bus arrives 10 minutes after Patrick's. Which sentence MUST be true? | A: Hannah's bus arrives at 7.30pm. | B: Jacob's bus arrives at 7.40pm. | C: Hannah lives further from town than Jacob. | D: Patrick and Sushmita arrive at the same time. | E: Sushmita arrives at 7.50pm.","B","Patrick 7.15, Hannah 10 minutes later = 7.25, Jacob 15 minutes after that = 7.40."],[6,"Lily, Charlie, Grace, Lucy and Dan are given money to spend on attracting visitors to their school fair. Charlie spends more than £10. Together, Grace and Dan spend £20 on paint to design posters. Lucy buys four banners for £3 each. Dan's paint costs £6.50. Lily spends half as much as Lucy. Which sentence MUST be true? | A: Charlie spends more than Grace. | B: Grace spends less than Lucy. | C: Dan spends the same amount as Grace. | D: Grace spends more than Lily. | E: Lucy spends the most money.","D","Grace = £20 − £6.50 = £13.50. Lucy = 4 × £3 = £12, so Lily = £6. Grace spends more than Lily."]]},{"id":"vr38","page":38,"title":"Letter Connections","instr":"Find the pair of letters that completes each sentence in the most sensible way.","example":"AD is to BE as MP is to ( NQ ). Both letters move forward 1.","tip":"The first and second letters don't always move the same way. Work out each one separately. After Z, go back to A.","alpha":1,"k":"text","qs":[[1,"CH is to EJ as LN is to ( _ )",["NP"],"From CH to EJ: the first letter goes forward 2 (C→E), the second goes forward 2 (H→J). Do the same to LN: L→N, N→P. Answer: NP."],[2,"RU is to TW as FH is to ( _ )",["HJ"],"From RU to TW: the first letter goes forward 2 (R→T), the second goes forward 2 (U→W). Do the same to FH: F→H, H→J. Answer: HJ."],[3,"GJ is to FI as OR is to ( _ )",["NQ"],"From GJ to FI: the first letter goes back 1 (G→F), the second goes back 1 (J→I). Do the same to OR: O→N, R→Q. Answer: NQ."],[4,"FR is to JV as LS is to ( _ )",["PW"],"From FR to JV: the first letter goes forward 4 (F→J), the second goes forward 4 (R→V). Do the same to LS: L→P, S→W. Answer: PW."],[5,"AZ is to CX as BY is to ( _ )",["DW"],"From AZ to CX: the first letter goes forward 2 (A→C), the second goes back 2 (Z→X). Do the same to BY: B→D, Y→W. Answer: DW."],[6,"CB is to HG as NM is to ( _ )",["SR"],"From CB to HG: the first letter goes forward 5 (C→H), the second goes forward 5 (B→G). Do the same to NM: N→S, M→R. Answer: SR."],[7,"AD is to ZE as PR is to ( _ )",["OS"],"From AD to ZE: the first letter goes back 1 (A→Z), the second goes forward 1 (D→E). Do the same to PR: P→O, R→S. Answer: OS."],[8,"YM is to AO as LF is to ( _ )",["NH"],"From YM to AO: the first letter goes forward 2 (Y→A), the second goes forward 2 (M→O). Do the same to LF: L→N, F→H. Answer: NH."],[9,"JO is to LL as QY is to ( _ )",["SV"],"From JO to LL: the first letter goes forward 2 (J→L), the second goes back 3 (O→L). Do the same to QY: Q→S, Y→V. Answer: SV."],[10,"SH is to VE as WD is to ( _ )",["ZA"],"From SH to VE: the first letter goes forward 3 (S→V), the second goes back 3 (H→E). Do the same to WD: W→Z, D→A. Answer: ZA."],[11,"PS is to LR as BG is to ( _ )",["XF"],"From PS to LR: the first letter goes back 4 (P→L), the second goes back 1 (S→R). Do the same to BG: B→X, G→F. Answer: XF."],[12,"LO is to IR as RI is to ( _ )",["OL"],"From LO to IR: the first letter goes back 3 (L→I), the second goes forward 3 (O→R). Do the same to RI: R→O, I→L. Answer: OL."],[13,"NU is to IP as DA is to ( _ )",["YV"],"From NU to IP: the first letter goes back 5 (N→I), the second goes back 5 (U→P). Do the same to DA: D→Y, A→V. Answer: YV."],[14,"SL is to VI as RB is to ( _ )",["UY"],"From SL to VI: the first letter goes forward 3 (S→V), the second goes back 3 (L→I). Do the same to RB: R→U, B→Y. Answer: UY."],[15,"QJ is to MN as UF is to ( _ )",["QJ"],"From QJ to MN: the first letter goes back 4 (Q→M), the second goes forward 4 (J→N). Do the same to UF: U→Q, F→J. Answer: QJ."],[16,"JV is to MW as FR is to ( _ )",["IS"],"From JV to MW: the first letter goes forward 3 (J→M), the second goes forward 1 (V→W). Do the same to FR: F→I, R→S. Answer: IS."],[17,"FP is to CR as LX is to ( _ )",["IZ"],"From FP to CR: the first letter goes back 3 (F→C), the second goes forward 2 (P→R). Do the same to LX: L→I, X→Z. Answer: IZ."],[18,"TG is to YB as VE is to ( _ )",["AZ"],"From TG to YB: the first letter goes forward 5 (T→Y), the second goes back 5 (G→B). Do the same to VE: V→A, E→Z. Answer: AZ."]]},{"id":"vr39","page":39,"title":"Word Grids","instr":"Use all the words to fill in the blanks in the grid. One letter has been filled in for you.","example":"Find a word that fits the letter you've been given, then work outwards.","tip":"Look at where the words cross: they must share a letter there. Cross out each word as you use it.","k":"grid","qs":[[1,"Words: might, eight, drive, dream","DREAMR###II###GV###HEIGHT","Start with the letter you're given. DREAM across the top; EIGHT across the bottom; DRIVE down the left; MIGHT down the right.",{"given":[0,2]}],[2,"Words: shine, lease, erase, shell","SHELLH###EI###AN###SERASE","Start with the letter you're given. SHELL across the top; ERASE across the bottom; SHINE down the left; LEASE down the right.",{"given":[0,4]}],[3,"Words: loyal, annoy, crave, sunny","CRAVE##N##SUNNY##O##LOYAL","Start with the letter you're given. CRAVE across the top; SUNNY across the middle; LOYAL across the bottom; ANNOY down the middle.",{"given":[4,2]}],[4,"Words: under, ripen, terse, rapid","TERSE##A##RIPEN##I##UNDER","Start with the letter you're given. TERSE across the top; RIPEN across the middle; UNDER across the bottom; RAPID down the middle.",{"given":[2,2]}],[5,"Words: timid, local, mimic, tidal, admit","A#T#LD#I#OMIMICI#I#ATIDAL","Start with the letter you're given. MIMIC across the middle; TIDAL across the bottom; ADMIT down the left; TIMID down the middle; LOCAL down the right.",{"given":[4,0]}],[6,"Words: heart, armed, tombs, tests, hotly","HOTLYE#O##ARMEDR#B##TESTS","Start with the letter you're given. HOTLY across the top; ARMED across the middle; TESTS across the bottom; HEART down the left; TOMBS down the middle.",{"given":[2,2]}],[7,"Words: orate, blank, table, troop, poker","TABLER#L##ORATEO#N##POKER","Start with the letter you're given. TABLE across the top; ORATE across the middle; POKER across the bottom; TROOP down the left; BLANK down the middle.",{"given":[2,1]}],[8,"Words: rivet, rocks, cease, treat, skirt","RIVETO###RCEASEK###ASKIRT","Start with the letter you're given. RIVET across the top; CEASE across the middle; SKIRT across the bottom; ROCKS down the left; TREAT down the right.",{"given":[4,4]}],[9,"Words: north, medic, mourn, donor, catch","MOURNE###ODONORI###TCATCH","Start with the letter you're given. MOURN across the top; DONOR across the middle; CATCH across the bottom; MEDIC down the left; NORTH down the right.",{"given":[2,1]}]]},{"id":"vr40","page":"40–44","title":"Assessment Test 1","instr":"A mixed test of 60 questions. Allow 40 minutes and work as quickly and carefully as you can.","tip":"Each group of questions has its own instructions. Read them before you start the group.","k":"text","test":1,"qs":[[1,"A=3 B=8 C=13 D=20 E=24   A × B = ( _ )",["E"],"3 × 8 = 24, which is E.",{"sec":"Each letter stands for a number. Work out the answer to each sum as a letter."}],[2,"A=2 B=7 C=10 D=14 E=24   D ÷ B = ( _ )",["A"],"14 ÷ 7 = 2, which is A."],[3,"A=6 B=7 C=9 D=18 E=24   E − D = ( _ )",["A"],"24 − 18 = 6, which is A."],[4,"A=2 B=6 C=17 D=22 E=25   D ÷ A + B = ( _ )",["C"],"22 ÷ 2 = 11, + 6 = 17, which is C."],[5,"A=1 B=3 C=5 D=7 E=18   E ÷ B − B = ( _ )",["B"],"18 ÷ 3 = 6, − 3 = 3, which is B."],[6,"Words: TOYS YOGA STAY TOGA   Codes: 6413 3521 4521 | Find the code for the word TOYS.",["4536"],"3521 and 4521 share the ending 521, so they're YOGA and TOGA (which share OGA). That makes STAY = 6413: S=6, T=4, A=1, Y=3. Then YOGA = 3521 (O=5, G=2). So TOYS = 4, 5, 3, 6 = 4536.",{"sec":"The number codes for three of these four words are listed in a random order. Work out the code to answer the questions."}],[7,"Words: TOYS YOGA STAY TOGA   Codes: 6413 3521 4521 | Find the code for the word STAG.",["6412"],"S=6, T=4, A=1, G=2, so STAG = 6412."],[8,"Words: TOYS YOGA STAY TOGA   Codes: 6413 3521 4521 | Find the word that has the number code 2514.",["GOAT"],"2=G, 5=O, 1=A, 4=T: GOAT."],[9,"Words: MAIM RAIN PAIR RAMP   Codes: 4512 4536 1531 | Find the code for the word PAIR.",["2534"],"MAIM has the same first and last letter, so it's 1531. That gives M=1, A=5, I=3 … PAIR = 2534."],[10,"Words: MAIM RAIN PAIR RAMP   Codes: 4512 4536 1531 | Find the code for the word PRIM.",["2431"],"P=2, R=4, I=3, M=1, so PRIM = 2431."],[11,"Words: MAIM RAIN PAIR RAMP   Codes: 4512 4536 1531 | Find the word that has the number code 2536.",["PAIN"],"2=P, 5=A, 3=I, 6=N: PAIN."],[12,"Josh edited his winning story.",["SHED"],"JoSH EDited → SHED",{"sec":"A four-letter word is hidden at the end of one word and the start of the next. Type the hidden word."}],[13,"Ayesha went walking with emus.",["THEM"],"wiTH EMus → THEM"],[14,"The cow entered the field.",["WENT"],"coW ENTered → WENT"],[15,"We're having pizza for tea.",["FORT"],"FOR Tea → FORT"],[16,"The silver urn is hot.",["SHOT"],"iS HOT → SHOT"],[17,"7, 14, 14, 21, 21, ( _ )",["28"],"Each multiple of 7 appears twice. Next is 28.",{"sec":"Find the number that continues each sequence in the best way."}],[18,"36, 30, 24, 18, 12, ( _ )",["6"],"Take away 6 each time."],[19,"5, 10, 20, 40, ( _ )",["80"],"Double each time."],[20,"50, 45, 40, 35, 30, ( _ )",["25"],"Take away 5 each time."],[21,"4, 5, 7, 10, 14, ( _ )",["19"],"Add 1, 2, 3, 4, then 5: 14 + 5 = 19."],[22,"(big|main|ugly) (small|large|cold)",["big","large"],"Big and large mean the same.",{"k":"groups","sec":"Pick two words, one from each set of brackets, that have the most similar meaning."}],[23,"(run|camp|wet) (cold|damp|sleep)",["wet","damp"],"Wet and damp mean nearly the same.",{"k":"groups"}],[24,"(most|small|huge) (little|lots|some)",["small","little"],"Small and little mean the same.",{"k":"groups"}],[25,"(sad|moan|happy) (angry|yell|glad)",["happy","glad"],"Happy and glad mean the same.",{"k":"groups"}],[26,"(run|mark|push) (walk|sprint|pull)",["run","sprint"],"To sprint is to run fast.",{"k":"groups"}],[27,"(pen|sketch|book) (leaflet|paint|draw)",["sketch","draw"],"To sketch is to draw.",{"k":"groups"}],[28,"Emma, Seren, Kate, Oisin and Tom are talking about how they travel to school. Emma and Seren travel to school by bus every day. Kate and Oisin go by car each day apart from Tuesday. On Tuesday, they get the bus. Tom walks to school every day except Friday. Which sentence CANNOT be true? | A: Kate goes to school by car on Monday. | B: Tom walks to school on Monday. | C: All the children go to school by bus on Tuesday. | D: Seren and Emma travel by bus on Wednesday. | E: Oisin travels by car on Friday.","C","Tom walks on Tuesday, so not everyone gets the bus on Tuesday.",{"k":"pick","sec":"Read the information carefully, then use it to answer the question."}],[29,"Oliver, Amaya, Katya, Timur and Rosie all go to bed at different times. Rosie goes before [cut off in the scan] but after Timur. Amaya and Oliver go to bed at the same time. Katya goes to bed before [cut off]. Which sentence MUST be true? | A: Katya goes to bed earliest. | B: Timur goes to bed after Rosie. | C: Rosie goes to bed at 8.30pm. | D: Amaya goes to bed after Rosie. | E: Oliver goes to bed after Amaya.","D","B can't be right (Rosie goes after Timur), C isn't given, and E can't be right (Amaya and Oliver go at the same time). D fits if Rosie goes before Amaya and Oliver. Part of this question was cut off in the photo.",{"k":"pick","flag":1}],[30,"PX is to OW as MT is to ( _ )",["LS"],"Both letters go back 1: M→L, T→S.",{"sec":"Find the pair of letters that completes each sentence in the most sensible way.","alpha":1}],[31,"DW is to EV as GT is to ( _ )",["HS"],"First letter +1 (G→H), second −1 (T→S).",{"alpha":1}],[32,"RV is to VZ as NQ is to ( _ )",["RU"],"Both letters go forward 4: N→R, Q→U.",{"alpha":1}],[33,"FJ is to FL as NP is to ( _ )",["NR"],"First letter stays, second +2: P→R.",{"alpha":1}],[34,"MN is to JQ as JQ is to ( _ )",["GT"],"First letter −3 (J→G), second +3 (Q→T).",{"alpha":1}],[35,"Hat is to (hair|head|warm) as glove is to (hand|foot|winter).",["head","hand"],"A hat goes on your head; a glove goes on your hand.",{"k":"groups","sec":"Pick two words, one from each set of brackets, that complete the sentence in the most sensible way."}],[36,"Car is to (walk|drive|play) as bike is to (run|ride|fall).",["drive","ride"],"You drive a car and ride a bike.",{"k":"groups"}],[37,"Sky is to (blue|cloud|bird) as grass is to (grow|mow|green).",["blue","green"],"The sky is blue; grass is green.",{"k":"groups"}],[38,"Doctor is to (brain|hospital|health) as teacher is to (book|library|school).",["hospital","school"],"A doctor works in a hospital; a teacher works in a school.",{"k":"groups"}],[39,"Trunk is to (bear|deer|elephant) as antenna is to (ant|mole|badger).",["elephant","ant"],"An elephant has a trunk; an ant has antennae.",{"k":"groups"}],[40,"dog (get) met   pat ( _ ) mop",["TOP"],"The middle word = last letter of the first word, 2nd letter of the third word, last letter of the third word: T, O, P.",{"sec":"The words in the second set follow the same pattern as the first set. Find the missing word.  Example: pot (hot) how → tip (sip) sea"}],[41,"felt (ten) nail   mast ( _ ) grow",["TAG"],"Last letter of the first word, its 2nd letter, then the first letter of the third word: T, A, G."],[42,"cart (not) honk   make ( _ ) scan",["ACE"],"3rd and 2nd letters of the third word, then the last letter of the first word: A, C, E."],[43,"milk (lip) nape   dart ( _ ) same",["RAM"],"3rd and 2nd letters of the first word, then the 3rd letter of the third word: R, A, M."],[44,"nip (pig) peg   nag ( _ ) fit",["FAT"],"First letter of the third word, 2nd letter of the first word, last letter of the third word: F, A, T.",{"flag":1}],[45,"mire (rim) fine   both ( _ ) make",["TAB"],"3rd letter of the first word, 2nd letter of the third word, 1st letter of the first word: T, A, B."],[46,"1 (2) 1   2 (4) 2   3 ( _ ) 3",["6"],"Add the outside numbers: 3 + 3 = 6.",{"sec":"Find the number that completes the final set in the same way as the first two sets."}],[47,"6 (9) 3   8 (14) 6   7 ( _ ) 9",["16"],"Add the outside numbers: 7 + 9 = 16."],[48,"4 (11) 15   9 (6) 15   6 ( _ ) 18",["12"],"The difference: 18 − 6 = 12."],[49,"3 (6) 9   7 (10) 13   4 ( _ ) 10",["7"],"Halfway between: 4 and 10 → 7."],[50,"6 (12) 2   3 (9) 3   4 ( _ ) 8",["32"],"Multiply: 4 × 8 = 32."],[51,"(harden solidify) (group type) | jelly kind set","set","Jelly sets (hardens), and a set is a group.",{"k":"pick","sec":"Pick the word that has a similar meaning to the words in both sets of brackets."}],[52,"(solid tough) (difficult tricky) | hard easy uneven","hard","Hard means solid, and also difficult.",{"k":"pick"}],[53,"(see notice) (pimple blackhead) | look spot stain","spot","To spot something is to see it; a spot is a pimple.",{"k":"pick"}],[54,"(tin container) (could able) | vessel can capable","can","A can is a tin; 'can' means you are able to.",{"k":"pick"}],[55,"(stick racket) (knock strike) | bat hurt hit","bat","A bat is a stick or racket; to bat is to strike.",{"k":"pick"}],[56,"pause | The spy's plan had many ___. | stages weaknesses aims risks strengths","weaknesses","pause rhymes with flaws, which means weaknesses.",{"k":"pick","sec":"The word on the left rhymes with a synonym of the missing word, but not the word itself. Pick the missing word."}],[57,"fonder | My friends and I often ___ through the fields. | cycle roam creep bound speed","roam","fonder rhymes with wander, which means roam.",{"k":"pick"}],[58,"relate | Jaya tried to ___ her brother in the crowd. | alert guard ignore pinpoint assist","pinpoint","relate rhymes with locate, which means pinpoint.",{"k":"pick"}],[59,"antique | Yahya's dad didn't believe his ___ excuse for being late. | baffling feeble genuine hilarious normal","feeble","antique rhymes with weak, which means feeble.",{"k":"pick"}],[60,"bamboo | He wanted to ___ the other athletes. | applaud intimidate inspire greet surpass","surpass","bamboo rhymes with outdo, which means surpass.",{"k":"pick"}]]}];

const EBOOK=[{"id":"en24","page":24,"title":"Spotting Devices","instr":"Read the passage, then answer the questions.","tip":"Simile = 'like' or 'as'. Metaphor = says something IS something else. Personification = gives an object human actions.","qs":[[1,"Which technique is used in: \"the forest was a treasure chest of filming opportunities\"?",["metaphor"],"It says the forest IS a treasure chest, so it's a metaphor.",{"k":"open"}],[2,"Which technique is used in: \"as excited as a child at Christmas\"?",["simile"],"It compares using 'as … as', so it's a simile.",{"k":"open"}],[3,"Which technique is used in: \"thorny vines gleefully tangled themselves\"?",["personification"],"Vines can't feel glee. Giving them human feelings is personification.",{"k":"open"}],[4,"Find an example of alliteration in the text.",["fragrant ferns","curly blonde","cursed","family"],"\"fragrant ferns\" — both words start with F.",{"k":"open","model":"fragrant ferns"}],[5,"Find an example of onomatopoeia in the text.",["cracking","gasped"],"\"cracking\" sounds like the noise it describes.",{"k":"open","model":"cracking"}],[6,"Find an abbreviation in the text.",["chimps","chimp"],"\"chimps\" is short for chimpanzees.",{"k":"open","model":"chimps"}],[7,"Find a synonym of 'thick'.",["dense"],"\"dense undergrowth\": dense means thick.",{"k":"open"}],[8,"Find an antonym of 'typical'.",["rare"],"\"a rare sight\": rare is the opposite of typical.",{"k":"open"}]],"ref":"Read the passage on page 24 of your book first."},{"id":"en25","page":25,"title":"Understanding Devices","instr":"Read the passage, then tap the correct option for each question.","tip":"Think about how the text makes you feel.","qs":[[1,"The author says that Haji's duvet is a \"cave\". This shows that his duvet is: | A: shaped like a cave. | B: made of rock. | C: very cold and dark.","C","Caves are dark and cold, and the passage says the 'dark cave'.",{"k":"pick"}],[2,"The author says that Haji \"hissed\". Why do you think Haji does this? | A: He's angry. | B: He's in pain. | C: He doesn't want to make much noise.","C","Hissing is a quiet, sharp whisper: he doesn't want to be heard.",{"k":"pick"}],[3,"Haji's heartbeat was a \"drum thumping inside his chest\". This shows that: | A: his heartbeat was loud. | B: he was playing the drums. | C: his heartbeat was quiet.","A","Drums are loud, so his heart was beating loudly with fear.",{"k":"pick"}],[4,"\"The curtains whispered in the breeze.\" What does this tell you about how the curtains moved? | A: They moved softly. | B: They moved quickly. | C: They moved constantly.","A","A whisper is soft and quiet.",{"k":"pick"}],[5,"The author compares the noise to the \"growl of a strange animal\". What does this suggest about whatever is making the noise? | A: It's dangerous. | B: It's friendly. | C: It's sleeping.","A","A growl is a warning sound, so it seems dangerous.",{"k":"pick"}]],"ref":"Read the passage on page 25 of your book first."},{"id":"en26","page":26,"title":"Writing Fiction: Adjectives & Clauses","instr":"Write your answers. Mum or Dad will mark these.","tip":"A clause is part of a sentence and must have a verb.","qs":[[1,"Replace the word in bold with a different adjective: Calvin was **tired** after staying up all night.",[],"e.g. exhausted, sleepy, weary",{"k":"write","model":"exhausted"}],[2,"We bought a **large** bag of popcorn.",[],"e.g. huge, enormous, giant",{"k":"write","model":"huge"}],[3,"The shopping centre was **busy** on Saturday.",[],"e.g. crowded, packed, bustling",{"k":"write","model":"crowded"}],[4,"Petra found the scientific article **boring**.",[],"e.g. dull, tedious",{"k":"write","model":"dull"}],[5,"Basma told a **funny** joke about poodles.",[],"e.g. hilarious, amusing",{"k":"write","model":"hilarious"}],[6,"Our maths homework was really **hard**.",[],"e.g. difficult, tricky, challenging",{"k":"write","model":"difficult"}],[7,"The new girl in our class is **small**.",[],"e.g. tiny, petite, little",{"k":"write","model":"tiny"}],[8,"Siân's new car was already **dirty** when she got home.",[],"e.g. filthy, muddy, grubby",{"k":"write","model":"filthy"}],[9,"Add a clause: Chen ran to the shop …",[],"e.g. … because he had run out of milk.",{"k":"write"}],[10,"Add a clause: Maggie owns a dog …",[],"e.g. … which loves chasing squirrels.",{"k":"write"}],[11,"Add a clause: Danny was really happy …",[],"e.g. … when he won the race.",{"k":"write"}],[12,"Add a clause: I used to like horses …",[],"e.g. … until one stepped on my foot.",{"k":"write"}],[13,"Add a clause: We drove to the beach …",[],"e.g. … even though it was raining.",{"k":"write"}],[14,"Add a clause: Shima read a book …",[],"e.g. … while she waited for the bus.",{"k":"write"}],[15,"Add a clause: Arjun was angry …",[],"e.g. … because his brother broke his toy.",{"k":"write"}],[16,"Add a clause: We're going on holiday …",[],"e.g. … as soon as school finishes.",{"k":"write"}]]},{"id":"en27","page":27,"title":"Writing Fiction: Describing & Planning","instr":"Write your answers. Mum or Dad will mark these.","tip":"Think about each character's appearance and personality.","qs":[[1,"Write three adjectives to describe: A witch",[],"e.g. wicked, wrinkled, cunning",{"k":"write","fields":["1","2","3"]}],[2,"Write three adjectives to describe: A forest",[],"e.g. dark, tangled, ancient",{"k":"write","fields":["1","2","3"]}],[3,"Write three adjectives to describe: A policeman",[],"e.g. brave, tall, helpful",{"k":"write","fields":["1","2","3"]}],[4,"Write three adjectives to describe: A city",[],"e.g. busy, noisy, sprawling",{"k":"write","fields":["1","2","3"]}],[5,"Write three adjectives to describe: A lamb",[],"e.g. fluffy, gentle, playful",{"k":"write","fields":["1","2","3"]}],[6,"Write three adjectives to describe: A field",[],"e.g. green, peaceful, open",{"k":"write","fields":["1","2","3"]}],[7,"Plan a story called \"An Exciting Day Out\". Use one of your characters and settings.",[],"One sentence each for what happens at the beginning, middle and end.",{"k":"write","fields":["Beginning","Middle","End"],"long":1}],[8,"Plan a story called \"A Surprising Adventure\".",[],"One sentence each for the beginning, middle and end.",{"k":"write","fields":["Beginning","Middle","End"],"long":1}],[9,"Choose one of your plans and write a full story of about 250 words.",[],"Use adjectives, similes and interesting clauses. Check your spelling and punctuation.",{"k":"write","essay":250}]]},{"id":"en28","page":28,"title":"Writing Non-Fiction: Purpose & Plans","instr":"Is each sentence Describing (D), Persuading (P) or Informing (I)?","tip":"If the text is trying to get the reader to do something, it's persuasive.","qs":[[1,"Canada Geese migrate thousands of miles south each year. | D P I","I","It gives a fact, so it's informing.",{"k":"pick"}],[2,"Can you afford to miss out on six months of free gym membership? | D P I","P","It's trying to get you to sign up: persuading.",{"k":"pick"}],[3,"The Great Wall of China stretches over more than 5000 miles. | D P I","I","A fact, so informing.",{"k":"pick"}],[4,"The remote wood was filled with the enchanting sound of birdsong. | D P I","D","It paints a picture with adjectives: describing.",{"k":"pick"}],[5,"Please give generously; these children desperately need your help. | D P I","P","It asks you to give money: persuading.",{"k":"pick"}],[6,"The cherry tree's branches swayed gently and tiny petals drifted down. | D P I","D","It describes a scene: describing.",{"k":"pick"}],[7,"Write an essay plan: \"Describe a famous person you admire.\"",[],"Introduction, two points for the middle, and a conclusion.",{"k":"write","fields":["Beginning","Middle 1","Middle 2","End"],"long":1}],[8,"Write an essay plan: \"Are children given too much homework?\"",[],"Introduction, two points for the middle, and a conclusion.",{"k":"write","fields":["Beginning","Middle 1","Middle 2","End"],"long":1}]]},{"id":"en29","page":29,"title":"Writing Non-Fiction: Arguments & Essays","instr":"Write a sentence arguing FOR and AGAINST each statement.","tip":"You can make up facts to make your arguments more convincing.","qs":[[1,"Children under sixteen should travel on buses for free.",[],"For: it helps families save money. Against: it would cost the council a lot.",{"k":"write","fields":["For","Against"],"long":1}],[2,"Children should not have to do sport at school.",[],"For: some children hate sport and get upset. Against: exercise keeps you healthy.",{"k":"write","fields":["For","Against"],"long":1}],[3,"Every town should have a library.",[],"For: everyone can borrow books for free. Against: libraries are expensive to run.",{"k":"write","fields":["For","Against"],"long":1}],[4,"Keeping animals in zoos should be illegal.",[],"For: animals should live in the wild. Against: zoos protect endangered species.",{"k":"write","fields":["For","Against"],"long":1}],[5,"Write a letter to a friend persuading them to visit you. (about 250 words)",[],"Plan first. Use persuasive language and questions.",{"k":"write","essay":250}],[6,"Write a magazine article describing your perfect day. (about 250 words)",[],"Use adjectives and your senses.",{"k":"write","essay":250}],[7,"Write a letter to a friend telling them what your bedroom is like. (about 250 words)",[],"Describe it clearly so they can picture it.",{"k":"write","essay":250}],[8,"Write an essay for a time capsule, informing people what modern life is like. (about 250 words)",[],"Use facts, and organise it into paragraphs.",{"k":"write","essay":250}]]},{"id":"en30","page":"30–37","title":"Assessment Test 1","instr":"40 questions. Allow 40 minutes. You'll need your book for the reading passages.","k":"pick","test":1,"qs":[[1,"What job did Gary Dahl have before he started selling Pet Rocks? | A: He ran an advertising company. | B: He was an entrepreneur. | C: He worked in marketing. | D: He worked in advertising. | E: He was a salesman.","D","He was an 'advertising executive', so he worked in advertising.",{"k":"pick","sec":"📖 Read 'Pet Rocks' on page 30 of your book, then answer questions 1–12."}],[2,"Which of these statements is NOT true? | A: Gary Dahl lived in California. | B: Pet Rocks stopped selling in 1975. | C: The Rocks came in a carrying case. | D: Rocks sold best over Christmas. | E: The instruction manual said Rocks could be trained to roll over.","B","Sales dried up AFTER 1975, not in 1975.",{"k":"pick","flag":1}],[3,"Why did Dahl believe Rocks were the perfect pet? (1 house trained, 2 instruction manual, 3 no exercise, 4 no vet treatment, 5 bathing once a week) | A: 1 and 2 | B: 2 and 3 | C: 2 and 5 | D: 3 and 4 | E: 4 and 5","D","They didn't need walking (exercise) and there were no vet bills.",{"k":"pick"}],[4,"Which of these WASN'T mentioned in the instruction manual? | A: How to teach the Rock to sit. | B: How to teach the Rock to roll over. | C: How to care for your Rock. | D: How to teach the Rock to stay. | E: How to make a bed of straw for your Rock.","E","The straw bed came with the Rock; the manual didn't explain how to make one.",{"k":"pick"}],[5,"When were Pet Rocks most successful? | A: After 1975 | B: The beginning of 1975 | C: December 1975 | D: February 1976 | E: Christmas 1976","C","They sold well during the Christmas period, then sales dried up after 1975.",{"k":"pick"}],[6,"Why did Pet Rocks stop selling? | A: They were illegal. | B: Dahl ran out of rocks. | C: They were old-fashioned. | D: People lost interest in them. | E: They were too expensive.","D","They were a 'fad': people lost interest.",{"k":"pick"}],[7,"Why is Gary Dahl inspiring? | A: He is an executive. | B: He runs his own advertising company. | C: He invented the perfect pet. | D: He is rich. | E: He showed that anyone can be successful with the right idea.","E","He inspires inventors to think of new crazes.",{"k":"pick"}],[8,"Which word is closest in meaning to \"unique\"? | A: Unusual | B: Profitable | C: Original | D: Disastrous | E: Amusing","C","Unique means one of a kind: original.",{"k":"pick"}],[9,"Which is closest in meaning to \"fad\"? | A: Christmas gift | B: Short-lived trend | C: Bad idea | D: Treasured possession | E: Top-seller","B","A fad is popular for a short time.",{"k":"pick"}],[10,"Explain the phrase \"sales dried up\". | A: People stopped buying Pet Rocks. | B: Pet Rocks stopped being profitable. | C: Pet Rocks were hard to find in the shops. | D: Shops stopped stocking Pet Rocks. | E: Customers thought buying Pet Rocks was a waste of money.","A","Sales drying up means people stopped buying.",{"k":"pick"}],[11,"\"Dahl sold more than a million Pet Rocks.\" Which word is a verb? | A: Dahl | B: sold | C: more | D: million | E: Pet","B","'sold' is the action.",{"k":"pick"}],[12,"\"solution\" and \"phenomenon\" are examples of which part of speech? | A: Adjectives | B: Metaphors | C: Verbs | D: Adverbs | E: Nouns","E","They are things: nouns.",{"k":"pick"}],[13,"Why can't you tell what the Quangle Wangle looks like? | A: He sits at the top of a tall tree. | B: He wears a big hat. | C: He is shy and hides his face. | D: He is too tall. | E: There is a nest in front of his face.","B","His Beaver Hat was a hundred and two feet wide, so nobody could see his face.",{"k":"pick","sec":"📖 Read 'The Quangle Wangle's Hat' on page 33 of your book, then answer questions 13–24."}],[14,"How does the Quangle Wangle feel in the second verse? | A: Carefree | B: Hungry | C: Lonely | D: Merry | E: Content","C","Very few people come his way and life is 'far from great'.",{"k":"pick"}],[15,"Who came to the tree first? | A: Two birds | B: Nobody knows | C: One bird | D: A frog | E: A bumble bee","A","Mr. and Mrs. Canary came first.",{"k":"pick"}],[16,"Which of these is NOT mentioned in the poem? | A: A duck | B: A baboon | C: An owl | D: A stork | E: A heron","E","There's a Duck, a Blue Baboon, an Owl and a Stork, but no heron.",{"k":"pick"}],[17,"Why do visitors come to see the Quangle Wangle? | A: To see the Crumpetty Tree | B: To make noise with the Quangle Wangle | C: To live on the Quangle Wangle's hat | D: To dance with the Quangle Wangle | E: To build a nest for the Quangle Wangle","C","'We may build our homes on your lovely Hat.'",{"k":"pick"}],[18,"How does the Quangle Wangle feel about the visitors? | A: Confused | B: Daunted | C: Uncertain | D: Delighted | E: Angry","D","'What a wonderful noise there'll be!'",{"k":"pick"}],[19,"What type of poem is 'The Quangle Wangle's Hat'? | A: A limerick | B: A fable | C: A sonnet | D: A shape poem | E: A nonsense poem","E","Edward Lear wrote nonsense poems, full of made-up words.",{"k":"pick"}],[20,"\"On account of\" could most accurately be replaced by: | A: Given that | B: In spite of | C: Because of | D: Instead of | E: As well as","C","You can't see his face because of his hat.",{"k":"pick"}],[21,"\"airy\" could most accurately be replaced by: | A: Open | B: Light | C: Windy | D: Beautiful | E: Outdoors","A","An airy spot is open and spacious.",{"k":"pick","flag":1}],[22,"Which is closest in meaning to \"grant\"? | A: Reward | B: Refuse | C: Tell | D: Allow | E: Show","D","'Grant us that' means allow us that.",{"k":"pick"}],[23,"\"The Frog and the Fimble Fowl\" is an example of: | A: alliteration. | B: rhyme. | C: a simile. | D: a metaphor. | E: personification.","A","Frog, Fimble, Fowl all start with F.",{"k":"pick"}],[24,"What type of word is \"humbly\"? | A: Adjective | B: Adverb | C: Noun | D: Verb | E: Pronoun","B","It describes how they beg: an adverb (-ly).",{"k":"pick"}],[25,"Which part has the mistake? | A: Suntime Foods wishes | B: to announse a | C: new breakfast | D: product designed for young families. | N: No mistake","B","'announse' should be 'announce'.",{"k":"pick","sec":"Spelling: each line is split into parts A–D, as in your book (page 36). Pick the part with the spelling mistake, or N if there isn't one."}],[26,"Which part has the mistake? | A: Containing a range | B: of delicious and | C: nutritious ingrediants, | D: it's tasty, crunchy, colourful | N: No mistake","C","'ingrediants' should be 'ingredients'.",{"k":"pick"}],[27,"Which part has the mistake? | A: and guaranteed | B: to be a breakfast | C: serial of exceptional | D: quality. Our farmers harvest their | N: No mistake","C","'serial' should be 'cereal'.",{"k":"pick"}],[28,"Which part has the mistake? | A: organic crops with | B: extra care to ensure | C: perfect freshness every | D: time. It's delightfull with | N: No mistake","D","'delightfull' should be 'delightful'.",{"k":"pick"}],[29,"Which part has the mistake? | A: or without a splash | B: of chilled milk, so why | C: not start your day | D: with a bowl of \"Oat Pops\"? | N: No mistake","N","No spelling mistakes.",{"k":"pick"}],[30,"Which part has the mistake? | A: Gripping tightly to the rope: | B: both boys shuffled | C: forward so slowly | D: that they barely moved. | N: No mistake","A","The colon should be a comma.",{"k":"pick","sec":"Punctuation: pick the part with the punctuation mistake, or N if there isn't one (page 37)."}],[31,"Which part has the mistake? | A: The water was freezing, | B: causing them to shiver | C: almost uncontrollably. | D: Javed felt it pulling | N: No mistake","N","No punctuation mistakes.",{"k":"pick"}],[32,"Which part has the mistake? | A: vigorously at his ankles. | B: As they approached | C: the island in the centre | D: of the River dee, Lewis | N: No mistake","D","'Dee' is a name, so it needs a capital letter.",{"k":"pick"}],[33,"Which part has the mistake? | A: turned and called, | B: \"This is no fun, is it? | C: but his voice was carried | D: away on the breeze. Tears | N: No mistake","B","The speech needs closing speech marks after 'is it?'",{"k":"pick"}],[34,"Which part has the mistake? | A: streaming down his | B: face and lips quivering | C: he clenched his teeth | D: bravely and struggled on. | N: No mistake","B","There should be a comma after 'quivering'.",{"k":"pick","flag":1}],[35,"Natalie ___ watching the front door with eager anticipation. | A: was | B: were | C: is | D: did | E: had","A","'Natalie was watching'.",{"k":"pick","sec":"Choose the right word to fill the gap (page 37)."}],[36,"She had ___ given some wonderful presents for her birthday, | A: be | B: being | C: been | D: was | E: did","C","'She had been given'.",{"k":"pick"}],[37,"but she was waiting ___ the postman to deliver her cards. | A: of | B: at | C: to | D: for | E: on","D","'waiting for the postman'.",{"k":"pick"}],[38,"She hoped that her favourite uncle had remembered to send her a birthday card all the way ___ New Zealand. | A: to | B: in | C: for | D: of | E: from","E","'all the way from New Zealand'.",{"k":"pick"}],[39,"Natalie tapped her fingers impatiently. When ___ the postman come? | A: must | B: may | C: can | D: could | E: would","E","'When would the postman come?'",{"k":"pick"}],[40,"Then her mum, ___ was in the kitchen, heard an excited yell! | A: what | B: who | C: how | D: which | E: that","B","'who' is used for people.",{"k":"pick"}]]},{"id":"en38","page":"38–45","title":"Assessment Test 2","instr":"40 questions. Allow 40 minutes. You'll need your book for the reading passages.","k":"pick","test":1,"qs":[[1,"Why were Jimmy's friends \"bewildered\"? | A: They were lost in the woods. | B: They were finding the treasure hunt difficult. | C: They did not understand why Jimmy wanted to win. | D: They were bored because Jimmy kept talking. | E: They were confused by the clue.","E","Bewildered means confused; they couldn't work out the clue.",{"k":"pick","sec":"📖 Read 'The Treasure Hunt' on page 38 of your book, then answer questions 1–12."}],[2,"Why did Jimmy feel as though he had read the clue a hundred times? | A: He had already read it 99 times. | B: He was finding the clue hard to read. | C: He had read the clue lots of times but his team could not solve it. | D: He had read the clue lots of times but his team were not interested. | E: He enjoyed reading the clue so he kept reading it aloud.","C","'A hundred times' is an exaggeration: he'd read it again and again without solving it.",{"k":"pick"}],[3,"Why did Jimmy speak \"weakly\"? | A: He had lost his voice. | B: He did not really believe what he was saying. | C: He was speaking quietly so Freddie wouldn't overhear. | D: He was tired so he couldn't speak loudly. | E: He was annoyed because Felicity wanted to give up.","B","He says 'We are not giving up' but he'd felt a wave of disappointment.",{"k":"pick"}],[4,"How often did the school camping trip take place? | A: Once a month | B: Every six months | C: Once a year | D: Occasionally | E: The text doesn't say","C","It's the 'annual' camping trip.",{"k":"pick"}],[5,"Which activity is NOT mentioned in the text? | A: Building campfires | B: Sleeping outdoors | C: Nature walks | D: Building dens | E: Listening to ghost stories","A","Ghost stories were told around the campfire, but building campfires isn't mentioned.",{"k":"pick"}],[6,"Why was Freddie \"infamous\"? | A: He was the school football captain. | B: He was using underhand tactics. | C: He couldn't stand it if he didn't win. | D: He was the most popular boy at school. | E: He had broken Jimmy's team's compass and taken their map.","C","He was infamous for being a bad loser.",{"k":"pick","flag":1}],[7,"How do you think Jimmy's team feels in lines 19–20? | A: Nervous | B: Confused | C: Hopeful | D: Confident | E: Thoughtful","C","They think 'coop' and 'fowl' might solve the mystery.",{"k":"pick"}],[8,"Which word is closest in meaning to \"frustration\"? | A: Annoyance | B: Disappointment | C: Worry | D: Fear | E: Shame","A","Frustration is annoyance at not being able to do something.",{"k":"pick"}],[9,"Which is closest in meaning to \"underhand\"? | A: Tricky | B: Clever | C: Imaginative | D: Dishonest | E: Secret","D","Underhand tactics are dishonest ones.",{"k":"pick"}],[10,"\"tentatively\" could most accurately be replaced by: | A: casually. | B: quietly. | C: slowly. | D: hopefully. | E: uncertainly.","E","Tentatively means not sure.",{"k":"pick"}],[11,"\"maddening mystery\" is an example of: | A: A simile | B: Alliteration | C: A rhyme | D: Personification | E: A metaphor","B","Both words start with M.",{"k":"pick"}],[12,"\"Jimmy felt a wave of disappointment crash over him.\" What is this an example of? | A: A proverb | B: Personification | C: A simile | D: A metaphor | E: Alliteration","D","His disappointment IS a wave: a metaphor.",{"k":"pick"}],[13,"How does the spider try to get the fly into his parlour in the first verse? | A: By tempting the fly | B: By flattering the fly | C: By threatening the fly | D: By upsetting the fly | E: By teasing the fly","A","He offers 'many curious things to shew'.",{"k":"pick","sec":"📖 Read 'The Spider and the Fly' on page 41 of your book, then answer questions 13–24."}],[14,"Which does the spider claim to have in his parlour? | A: A bed with a warm quilt | B: Interesting objects | C: A winding staircase | D: Glass ornaments | E: Attractive curtains over the windows","B","'Many curious things.' (The winding stair leads TO the parlour.)",{"k":"pick"}],[15,"Why does the fly turn down the spider's offer? | A: She doesn't want to climb the staircase. | B: She is not interested in seeing the parlour. | C: She is too vain to accept the offer. | D: She would rather soar up high in the sky. | E: She thinks she will never escape from the parlour.","E","'Who goes up your winding stair can ne'er come down again.'",{"k":"pick"}],[16,"Why does the spider say the fly might need to lie on the bed? | A: She will be tired from walking up the stairs. | B: The bed is very comfortable. | C: She will need to rest after looking at the curious things. | D: She is tired from all her flying. | E: The spider loves having visitors to stay.","D","'You must be weary, dear, with soaring up so high.'",{"k":"pick"}],[17,"How would you describe the fly's attitude towards the spider? | A: Irritated | B: Curious | C: Distrustful | D: Grateful | E: Angry","C","She keeps saying 'Oh no, no' because she doesn't trust him.",{"k":"pick"}],[18,"In the third verse, what does the spider promise to show the fly? | A: What she looks like | B: A looking glass | C: The parlour shelf | D: Some pretty curtains | E: A pair of spectacles","B","'I have a little looking-glass upon my parlour shelf.'",{"k":"pick"}],[19,"The spider's language in the third verse could best be described as: | A: polite. | B: kind. | C: flattering. | D: genuine. | E: envious.","C","He praises her wings and eyes to trick her.",{"k":"pick"}],[20,"Which word is closest in meaning to \"gauzy\"? | A: Opaque | B: Tiny | C: Thin | D: Reflective | E: Shiny","C","Gauze is thin, see-through cloth.",{"k":"pick"}],[21,"Which word is closest in meaning to \"behold\"? | A: Understand | B: View | C: Grasp | D: Approve | E: Believe","B","Behold means see or view.",{"k":"pick"}],[22,"\"witty\" could most accurately be replaced by: | A: friendly. | B: amusing. | C: beautiful. | D: joyful. | E: peculiar.","B","Witty means clever and funny.",{"k":"pick"}],[23,"\"'Tis\" and \"ne'er\" are examples of: | A: possessives. | B: conjunctions. | C: exclamations. | D: adjectives. | E: contractions.","E","'Tis = it is, ne'er = never: shortened words.",{"k":"pick"}],[24,"What part of speech is \"winding\" in \"a winding stair\"? | A: Adverb | B: Adjective | C: Noun | D: Pronoun | E: Verb","B","It describes the stair: an adjective.",{"k":"pick"}],[25,"Eleni     it would be easy to make a campfire. | A: thinks | B: thought | C: has thought | D: thinked | E: thinking","B","'Eleni thought …' (past tense).",{"k":"pick","sec":"Choose the right word or phrase to fill the gap (page 44)."}],[26,"Earlier, she had collected a pile of sticks     she had arranged into a wigwam shape. | A: which | B: what | C: who | D: how | E: when","A","'which' refers to the sticks.",{"k":"pick"}],[27,"But they     been damp because they refused to catch fire. | A: must of | B: must have | C: must | D: should | E: would have","B","'must have been'. Never 'must of'.",{"k":"pick"}],[28,"Then, Eleni     a plume of smoke rising from one corner. | A: saw | B: see | C: seen | D: sawed | E: seed","A","'saw' is the past tense of see.",{"k":"pick"}],[29,"She added     twigs to the pile. | A: all | B: more | C: fewer | D: most | E: none","B","'She added more twigs'.",{"k":"pick"}],[30,"Suddenly the flames seized hold     the fire was alive! | A: and | B: but | C: at | D: if | E: until","A","'… seized hold and the fire was alive!'",{"k":"pick"}],[31,"Which part has the mistake? | A: Whenever we go for a | B: walk in the woods, | C: Dad likes to lecture us | D: on the surroundings. This | N: No mistake","N","No punctuation mistakes.",{"k":"pick","sec":"Punctuation: pick the part with the mistake, or N (page 44)."}],[32,"Which part has the mistake? | A: time it was on the | B: way leaves turn | C: brown in autumn: | D: whereas last time we estimated the | N: No mistake","C","The colon should be a comma.",{"k":"pick"}],[33,"Which part has the mistake? | A: height and age of | B: the biggest trees. | C: When he declared, We're | D: going to Brook Valley today,\" | N: No mistake","C","Missing opening speech marks before 'We're'.",{"k":"pick"}],[34,"Which part has the mistake? | A: Mita and I groaned: | B: Brook Valley was by | C: far the furthest, | D: trail from the car park! We | N: No mistake","C","There shouldn't be a comma after 'furthest'.",{"k":"pick"}],[35,"Which part has the mistake? | A: deliberately dashed off | B: in the opposite direction, | C: racing each other | D: to be first up the hill | N: No mistake","N","No punctuation mistakes.",{"k":"pick","flag":1}],[36,"Which part has the mistake? | A: Although the pantomime | B: wasn't dew to | C: start until 2 pm, | D: we left in plenty of time. | N: No mistake","B","'dew' should be 'due'.",{"k":"pick","sec":"Spelling: pick the part with the spelling mistake, or N (page 45)."}],[37,"Which part has the mistake? | A: (Trudy was worried about | B: finding a decent place | C: to park near the | D: theatre.) It was a good idea, | N: No mistake","N","No spelling mistakes.",{"k":"pick"}],[38,"Which part has the mistake? | A: because the snow was | B: really thick and the | C: traffick was crawling | D: at a snail's pace. We | N: No mistake","C","'traffick' should be 'traffic'.",{"k":"pick"}],[39,"Which part has the mistake? | A: discovered a splendid | B: space just behind | C: a restaurant, close to | D: the entrance. But, getting out | N: No mistake","N","No spelling mistakes.",{"k":"pick"}],[40,"Which part has the mistake? | A: of the car, Dad | B: slipped and hurt his ankle. | C: He didn't complane | D: much and enjoyed the show. | N: No mistake","C","'complane' should be 'complain'.",{"k":"pick","flag":1}]]}];

const NBOOK=[{"id":"nv10","page":"10–11","title":"Complete the Grid","instr":"Find which of the five small squares should replace the empty square.","tip":"Look along the rows and down the columns. Check shape, colour, position and how many.","k":"pick","ref":"Look at page 10–11 of your book for the shapes.","qs":[[4,"Question 4 · Look at question 4 in your book. | a b c d e","c","The triangle and flag swap places each time, so the missing square has the triangle above the flag.",{}],[5,"Question 5 · Look at question 5 in your book. | a b c d e","d","Marked d in your book.",{}],[6,"Question 6 · Look at question 6 in your book. | a b c d e","b","Marked b in your book.",{}],[7,"Question 7 · Look at question 7 in your book. | a b c d e","d","Marked d in your book.",{}]]},{"id":"nv11","page":"11","title":"Find the Figure Like the First Three","instr":"Find the figure on the right that is most like the three figures on the left.","tip":"Find what ALL three figures share: number of shapes, colours, sides, or where things are.","k":"pick","ref":"Look at page 11 of your book for the shapes.","qs":[[8,"Question 8 · Look at question 8 in your book. | a b c d e",null,"Mum or Dad will check this against the answer pages.",{}],[9,"Question 9 · Look at question 9 in your book. | a b c d e",null,"Mum or Dad will check this against the answer pages.",{}],[10,"Question 10 · Look at question 10 in your book. | a b c d e",null,"Mum or Dad will check this against the answer pages.",{}]]},{"id":"nv12","page":"12","title":"Horizontal Code","instr":"Work out what the code letters mean, then find the code for the new shape.","tip":"Find two figures that share a letter and spot what else they share.","k":"pick","ref":"Look at page 12 of your book for the shapes.","qs":[[3,"Question 3 · Look at question 3 in your book. | a b c d e",null,"Mum or Dad will check this against the answer pages.",{}],[4,"Question 4 · Look at question 4 in your book. | a b c d e",null,"Mum or Dad will check this ag
