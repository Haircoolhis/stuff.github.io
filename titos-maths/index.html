<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tito's 11+ Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#2B2340; --muted:#6E6787; --line:#ECE3D4;
  --purple:#6C4CF1; --purple-soft:#EEE9FF; --green:#1FA971; --green-soft:#E3F7EE;
  --red:#E5484D; --red-soft:#FDECEC; --amber:#F2A516; --amber-soft:#FFF3D6;
  --blue:#2F7DF6; --blue-soft:#E6F0FF; --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
@media (min-width:900px){ .wrap{max-width:960px} .tgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))} }
@media (min-width:700px){ .booktabs button{flex:1 1 20%} }
input,textarea,select{font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--purple);color:#fff;display:grid;place-items:center;font-family:Fredoka;font-size:24px;font-weight:700;transform:rotate(-6deg)}
.brand h1{font-size:22px}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(43,35,64,.06);margin-bottom:16px}
.btn{background:var(--purple);color:#fff;padding:13px 20px;border-radius:14px;font-weight:800;box-shadow:0 4px 0 #4A2FC4;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4A2FC4}
.btn.ghost{background:var(--purple-soft);color:var(--purple);box-shadow:0 4px 0 #D6CCFF}
.btn.green{background:var(--green);box-shadow:0 4px 0 #137A51}
.btn.amber{background:var(--amber);box-shadow:0 4px 0 #C2830C;color:#3A2600}
.btn.small{padding:9px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;color:var(--purple);font-weight:800;padding:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hello{font-size:28px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 4px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.step3{background:var(--bg);border-radius:14px;padding:12px}
.step3 b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;font-family:Fredoka;margin-bottom:6px}
.step3 p{margin:0;font-size:14.5px;font-weight:700}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.sheet{background:var(--card);border-radius:var(--radius);padding:18px;text-align:left;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(43,35,64,.06);border:2px solid transparent;transition:border-color .15s}
.sheet:hover{border-color:#DCD3FF}
.sheet .day{font-family:Fredoka;font-size:26px;font-weight:600;color:var(--ink)}
.sheet .topic{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .3s}
.sheet .meta{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;color:var(--muted);margin-top:8px}
.note{font-size:13px;color:#8A5A00;background:var(--amber-soft);border-radius:10px;padding:8px 10px;margin-top:10px;font-weight:700}

/* practice */
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dot{width:34px;height:34px;border-radius:10px;background:var(--card);color:var(--muted);font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--line)}
.dot.cur{outline:3px solid var(--purple);color:var(--ink)}
.dot.star{background:var(--green);color:#fff;box-shadow:0 2px 0 #137A51}
.dot.ok{background:var(--blue);color:#fff;box-shadow:0 2px 0 #1F5BB8}
.dot.wrong{background:var(--red);color:#fff;box-shadow:0 2px 0 #B3262B}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tq{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.tn{font-size:13px;font-weight:800;color:var(--muted)}
.tsum{font-family:Fredoka;font-size:24px;font-weight:600;margin:2px 0 8px}
.tans{width:100%;font-family:Fredoka;font-size:24px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);outline:none;text-align:center;color:var(--ink)}
.tans:focus{border-color:var(--purple)}
.tans.filled{border-color:#CFC4FF;background:var(--purple-soft)}
.mode-explain{font-size:13.5px;color:var(--muted);font-weight:700;margin-top:8px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:16px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.6;overflow-x:auto}
.mono.pre{white-space:pre}
.lbl{color:var(--muted);font-size:13px}
details.howto{background:var(--purple-soft);border-radius:14px;padding:10px 14px;margin-top:14px}
details.howto summary{font-weight:800;color:var(--purple);cursor:pointer}
details.howto ol{margin:8px 0 2px;padding-left:22px}
details.howto li{margin:4px 0;font-weight:700}
.group{background:var(--card);border-radius:var(--radius);margin-bottom:14px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(43,35,64,.06)}
.group>summary{list-style:none;padding:16px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.group>summary::-webkit-details-marker{display:none}
.group>summary h3{font-size:19px}
.group>summary small{color:var(--muted);font-weight:800;font-size:13px}
.group .chev{transition:transform .2s;color:var(--muted)}
.group[open] .chev{transform:rotate(90deg)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 14px 16px}
.mini{background:var(--bg);border-radius:14px;padding:12px}
.mini .d{font-family:Fredoka;font-size:20px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.mini .d span{font-size:13px;color:var(--muted);font-family:Nunito;font-weight:800}
.mini .bar{margin:8px 0}
.mini .row{gap:6px}
.mini .btn.small{padding:7px 10px;font-size:13.5px}
.mini.next{outline:3px solid var(--purple)}
.mini.locked{opacity:.55}
details.bkd{border-top:1px solid var(--line);padding:10px 0}details.bkd summary{cursor:pointer}
.bsel{font:inherit;font-size:15px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);max-width:100%;background:#fff}
.pm{display:inline-flex;gap:4px;margin-top:4px;flex-wrap:wrap}.pm button{padding:3px 8px;border-radius:8px;font-weight:800;font-size:13px;background:var(--bg);border:1.5px solid var(--line)}
.pm button.y{color:#0F6B46}.pm button.n{color:#9B1C20}
.flagq{border-bottom:1px solid var(--line);padding:10px 0}
.ulist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.ulist label{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:10px;padding:6px 8px;font-weight:700;font-size:14px}
.switch{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0}
.ptable td,.ptable th{padding:7px 4px;font-size:14px}
.vinstr{font-weight:700;color:var(--muted);margin:10px 0 6px;font-size:15px}
.vprompt{font-size:19px;font-weight:700;line-height:1.7;margin:8px 0}
.vin{font:inherit;font-family:Fredoka;font-size:20px;width:110px;padding:4px 8px;border-radius:10px;border:2px solid var(--line);text-align:center;text-transform:uppercase;margin:2px 4px;outline:none}
.vin:focus{border-color:var(--purple)} .vin.filled{border-color:#CFC4FF;background:var(--purple-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips.col{flex-direction:column;align-items:stretch}
.chip{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:16px;color:var(--ink)}
.chip.wide{text-align:left}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.chip:disabled{opacity:.6}
.vgrp{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:3px;margin:2px}
.vgrp .chip{padding:4px 9px;font-size:15px}
.vgrid{display:grid;grid-template-columns:repeat(5,46px);gap:3px;margin:10px 0}
.vgrid .gb{background:var(--ink);border-radius:4px;height:46px}
.vgrid .gc{width:46px;height:46px;border:2px solid var(--line);border-radius:6px;text-align:center;font-family:Fredoka;font-size:24px;text-transform:uppercase;padding:0;outline:none;color:var(--ink);background:#fff}
.vgrid .gc:focus{border-color:var(--purple)} .vgrid .gc.given{background:var(--amber-soft);font-weight:600}
.alpha{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0;font-size:12px}
.alpha span{display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:6px;padding:2px 0;width:24px}
.alpha i{font-style:normal;color:var(--muted);font-size:10px}
.secbar{background:var(--purple-soft);color:#3B2A8F;border-radius:14px;padding:12px 14px;font-weight:800;margin:6px 0 12px}
.vtq{padding:14px 16px}
.booktabs{display:flex;gap:8px;margin-bottom:14px}
.booktabs{flex-wrap:wrap}.booktabs button{flex:1 1 40%;padding:12px;border-radius:14px;font-weight:800;background:var(--card);color:var(--muted);box-shadow:0 2px 0 var(--line)}
.booktabs button.on{background:var(--purple);color:#fff;box-shadow:0 3px 0 #4A2FC4}
.mini .t{font-size:13px;font-weight:800;color:var(--muted);margin-top:2px;min-height:34px}
.refnote{background:var(--amber-soft);color:#7A4E00;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14.5px;margin:6px 0}
.wf{margin:8px 0}.wf label{display:block;font-weight:800;font-size:14px;color:var(--muted);margin-bottom:3px}
.wline{width:100%;font:inherit;font-size:17px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);outline:none;resize:vertical}
.wline:focus,.essay:focus{border-color:var(--purple)}
.essay{width:100%;font:inherit;font-size:17px;line-height:1.5;padding:10px 12px;border-radius:12px;border:2px solid var(--line);outline:none;resize:vertical}
.herans{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;font-weight:700}
.dot.review{background:var(--amber);color:#3A2600}
.bookpg{background:var(--bg);border-radius:14px;padding:8px 10px;margin:8px 0}
.bookpg summary{font-weight:800;color:var(--purple);cursor:pointer}
.pgs{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:70vh;overflow:auto;border-radius:10px}
.pgs img{width:100%;border-radius:8px;cursor:zoom-in;background:#fff}
.pgcard{position:sticky;top:6px;z-index:5;padding:10px 12px}
.pgcard .pgs{max-height:42vh}
.zoom{position:fixed;inset:0;background:rgba(20,16,32,.92);z-index:100;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom .zin img{display:block;width:200%;max-width:none;margin:0 0 10px}
.zoom .zx{position:fixed;top:12px;right:12px;z-index:101}
@media (min-width:1000px){ .zoom .zin img{width:140%} }
.dot.help{background:var(--amber);color:#3A2600;box-shadow:0 2px 0 #C2830C}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:800;font-size:14px}
.qtext{font-family:Fredoka;font-size:clamp(40px,10vw,64px);font-weight:600;text-align:center;margin:14px 0 6px;letter-spacing:.5px}
.qtext .op{color:var(--purple);padding:0 .15em}
.ansrow{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
.ans{font-family:Fredoka;font-size:34px;width:210px;text-align:center;padding:10px 12px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);outline:none}
.ans:focus{border-color:var(--purple)}
.ans.good{border-color:var(--green);background:var(--green-soft)}
.ans.bad{border-color:var(--red);background:var(--red-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{border-radius:16px;padding:14px 16px;margin-top:12px;font-weight:700;line-height:1.45}
.fb.good{background:var(--green-soft);color:#0F6B46}
.fb.bad{background:var(--red-soft);color:#9B1C20}
.fb.info{background:var(--blue-soft);color:#1B4E9E}
.fb h3{font-size:20px;margin-bottom:4px}
.helpers{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.navrow{display:flex;justify-content:space-between;margin-top:18px}

/* column work */
.work{margin-top:16px;background:#FCFAF6;border:2px dashed var(--line);border-radius:18px;padding:16px}
.grid{display:grid;justify-content:center;margin:6px auto 10px;font-family:Fredoka;font-weight:500}
.cell{width:42px;height:50px;display:grid;place-items:center;font-size:34px;position:relative;border-radius:8px}
.cell.dp{width:18px}
.cell.mark{height:26px;font-size:17px;color:var(--red);font-weight:600}
.cell.mark.carry{color:var(--blue)}
.cell.ph{color:#B9AFC9}
.cell.ph::after{content:"";position:absolute;bottom:6px;left:12px;right:12px;height:2px;background:#D7CFE4}
.cell.hl{background:var(--amber-soft)}
.cell.struck::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;background:var(--red);transform:rotate(-20deg);border-radius:2px}
.cell.res{color:var(--purple);font-weight:600}
.cell.op{color:var(--purple)}
.rule{grid-column:1/-1;height:3px;background:var(--ink);border-radius:2px;margin:2px 0}
.explain{background:#fff;border-radius:14px;padding:12px 14px;font-weight:700;min-height:52px;line-height:1.45}
.explain .tag{display:inline-block;background:var(--purple-soft);color:var(--purple);border-radius:8px;padding:1px 8px;font-size:13px;margin-bottom:4px}
.stepnav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.stepcount{color:var(--muted);font-weight:800;font-size:14px}

/* results */
.big{font-family:Fredoka;font-size:56px;font-weight:700;text-align:center;color:var(--purple)}
.stars{text-align:center;font-size:34px;letter-spacing:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;font-weight:800;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.p-star{background:var(--green-soft);color:#0F6B46}.p-ok{background:var(--blue-soft);color:#1B4E9E}.p-help{background:var(--amber-soft);color:#8A5A00}.p-wrong{background:var(--red-soft);color:#9B1C20}.p-none{background:#F1EEF6;color:var(--muted)}
.mist{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:520px){
  .steps3{grid-template-columns:1fr}
  .cell{width:34px;height:44px;font-size:28px}
  .cell.dp{width:14px}
  .ans{width:170px;font-size:30px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>

/* ===================== MATHS ENGINE ===================== */
const PLACE = {"-3":"thousandths","-2":"hundredths","-1":"tenths","0":"ones","1":"tens","2":"hundreds","3":"thousands"};
function split(s){const [i,d=""]=s.split(".");return {i:(i.replace(/^0+(?=\d)/,"")||"0"),d};}
function align(a,b){
  const A=split(a),B=split(b);
  const d=Math.max(A.d.length,B.d.length), L=Math.max(A.i.length,B.i.length);
  const ta=A.i.padStart(L," ")+A.d.padEnd(d,"0"), tb=B.i.padStart(L," ")+B.d.padEnd(d,"0");
  const phA=new Set(),phB=new Set();
  for(let k=L+A.d.length;k<L+d;k++)phA.add(k);
  for(let k=L+B.d.length;k<L+d;k++)phB.add(k);
  return {d,L,ta,tb,phA,phB,addedZeros:phA.size+phB.size, addedA:A.d.length<d, addedB:B.d.length<d};
}
const dig=c=>c===" "?0:+c;
function solve(a,op,b){
  const al=align(a,op==="+"?b:b), n=al.ta.length, cols=[];
  let carry=0,borrow=0; const res=new Array(n);
  for(let k=n-1;k>=0;k--){
    const top=dig(al.ta[k]),bot=dig(al.tb[k]),place=(al.L-1-k);
    if(op==="+"){
      const s=top+bot+carry; res[k]=s%10;
      cols.push({k,place,top,bot,carryIn:carry,sum:s,res:s%10,carryOut:s>=10?1:0}); carry=s>=10?1:0;
    }else{
      let t=top-borrow; const bin=borrow; let bout=0;
      if(t<bot){t+=10;bout=1}
      res[k]=t-bot; cols.push({k,place,top,bot,borrowIn:bin,t,res:t-bot,borrowOut:bout}); borrow=bout;
    }
  }
  let digits=res.join(""); if(carry) digits="1"+digits;
  const lead=carry?1:0;
  let ip=digits.slice(0,digits.length-al.d), dp=digits.slice(digits.length-al.d);
  ip=ip.replace(/^0+(?=\d)/,""); if(ip==="")ip="0";
  const full=al.d?ip+"."+dp:ip;
  return {al,cols,finalCarry:carry,full,nice:tidy(full),value:+full};
}
function tidy(s){ if(!s.includes("."))return s; s=s.replace(/0+$/,"").replace(/\.$/,""); return s; }
function digitsOnly(s){return String(s).replace(".","").replace(/^0+/,"").replace(/0+$/,"");}
function same(x,y){return Math.abs(x-y)<1e-9}

/* Work out WHY an answer is wrong (common decimal mistakes) */
function diagnose(a,op,b,ansStr){
  const ans=+ansStr, S=solve(a,op,b);
  if(same(ans,S.value)) return null;
  // 1. decimal points not lined up (digits lined up on the right instead)
  const na=parseInt(a.replace(".","")), nb=parseInt(b.replace(".",""));
  const wrongLine=String(Math.abs(op==="+"?na+nb:na-nb));
  const aDp=(a.split(".")[1]||"").length, bDp=(b.split(".")[1]||"").length;
  if(aDp!==bDp && digitsOnly(ansStr)===digitsOnly(wrongLine)) return "lineup";
  // 2. right digits, decimal point in the wrong place
  if(digitsOnly(ansStr)===digitsOnly(S.full)) return "point";
  // 3. forgot to carry / forgot to borrow
  const al=S.al; let out="";
  for(let k=0;k<al.ta.length;k++){const t=dig(al.ta[k]),u=dig(al.tb[k]);out+= op==="+"?(t+u)%10:Math.abs(t-u);}
  const v=al.d?+(out.slice(0,out.length-al.d)+"."+out.slice(out.length-al.d)):+out;
  if(same(ans,v)) return op==="+"?"carry":"borrow";
  if(op==="+" && S.cols.some(c=>c.carryOut) ) {
    // carried but added the carry wrongly → check carries ignored only in some columns: treat off-by-power-of-ten as carry error
    const diff=Math.abs(ans-S.value); for(let p=-3;p<=2;p++) if(same(diff,Math.pow(10,p))) return "carry";
  }
  if(op==="-" && S.cols.some(c=>c.borrowOut)){
    const diff=Math.abs(ans-S.value); for(let p=-3;p<=2;p++) if(same(diff,Math.pow(10,p))) return "borrow";
  }
  // 4. added instead of subtracted / vice versa
  const other=solve(a,op==="+"?"-":"+",b);
  if(op==="+" && +a>=+b && same(ans,other.value)) return "wrongop";
  if(op==="-" && same(ans,other.value)) return "wrongop";
  return "other";
}
const MISTAKES={
  lineup:{name:"Decimal points not lined up",tip:"It looks like the digits were lined up on the right instead of the decimal points. Put the decimal points directly on top of each other first, then fill the gaps with zeros."},
  point:{name:"Decimal point in the wrong place",tip:"Your digits are right — great working! — but the decimal point has moved. Bring it straight down, in line with the points above."},
  carry:{name:"Forgot to carry",tip:"One of the columns adds up to 10 or more. Write the ones digit and carry the 1 over to the next column on the left."},
  borrow:{name:"Forgot to borrow (exchange)",tip:"In one column the top digit is smaller than the bottom digit. Borrow 1 from the column on the left — it becomes 10 more."},
  wrongop:{name:"Used the wrong operation",tip:"Check the sign again — is it + or −?"},
  other:{name:"Small slip",tip:"Not quite. Line the decimal points up, add zeros, then go column by column from the right."}
};

/* ===================== MATHS ENGINE 2: ×, ÷ and % ===================== */
/* Exact decimals: {n: BigInt digits, s: number of decimal places} */
function P(str){ let s=String(str).replace(/,/g,""), pct=s.endsWith("%"); if(pct)s=s.slice(0,-1);
  let [i,d=""]=s.split("."); const v={n:BigInt((i||"0")+d), s:d.length}; if(pct)v.s+=2; return v; }
function dStr(v){ const neg=v.n<0n; let t=(neg?-v.n:v.n).toString().padStart(v.s+1,"0");
  const r=v.s? t.slice(0,t.length-v.s)+"."+t.slice(t.length-v.s) : t; return (neg?"-":"")+r; }
function dMul(a,b){ return {n:a.n*b.n, s:a.s+b.s}; }
function dDiv(a,b){ const num=a.n*10n**BigInt(b.s), den=b.n*10n**BigInt(a.s);
  for(let s=0;s<=10;s++){ const N=num*10n**BigInt(s); if(N%den===0n) return {v:{n:N/den,s},exact:true}; }
  const q=(num*1000n)/den; return {v:{n:(q+5n)/10n,s:2},exact:false}; }
const isPct=x=>String(x).endsWith("%");
const POW={"10":1,"100":2,"1000":3,"10000":4};
const powOf=x=>POW[String(x).replace(/,/g,"")]||0;
const fmtN=x=>{ x=String(x); if(isPct(x))return x; const [i,d]=x.split("."); const ii=i.length>=4?i.replace(/\B(?=(\d{3})+(?!\d))/g,","):i; return d!==undefined?ii+"."+d:ii; };
const opSym=o=>({"+":"+","-":"−","x":"×","/":"÷"}[o]||o);

function answer(a,op,b){
  if(op==="+"||op==="-"){ const S=solve(a,op,b); return {nice:S.nice, full:S.full, value:S.value, round:false}; }
  if(op==="x"){ const v=dMul(P(a),P(b)), full=dStr(v); return {nice:tidy(full), full, value:+full, round:false}; }
  const r=dDiv(P(a),P(b)), full=dStr(r.v);
  return {nice:r.exact?tidy(full):full, full, value:+full, round:!r.exact, exact:(+String(a).replace("%",""))/(+String(b).replace("%",""))};
}
function isRight(a,op,b,v){ const A=answer(a,op,b), x=+v; return A.round ? Math.abs(x-A.exact)<0.0051 : same(x,A.value); }

/* Which mistake did she probably make? */
function diagnoseAny(a,op,b,v){
  if(op==="+"||op==="-") return diagnose(a,op,b,v);
  if(isRight(a,op,b,v)) return null;
  const A=answer(a,op,b), x=+v, dm=!A.round && digitsOnly(v)===digitsOnly(A.full);
  if(op==="x"){
    if(isPct(a)||isPct(b)){ if(same(x,A.value*100)||same(x,A.value*10000)) return "noconvert"; if(dm) return "dpcount"; }
    const p=powOf(a)||powOf(b);
    if(p){ const other=powOf(a)?b:a; if(same(x,+other/Math.pow(10,p))) return "direction"; if(dm) return "places"; }
    if(dm) return "dpcount";
    if(same(x,+String(a).replace("%","")+ +String(b).replace("%",""))) return "wrongop";
  } else {
    const p=powOf(b);
    if(p){ if(same(x,+a*Math.pow(10,p))) return "direction"; if(dm) return "places"; }
    if(dm) return P(b).s>0 ? "divmove" : "point";
    if(same(x,+a*+b)) return "wrongop";
  }
  return "other";
}
Object.assign(MISTAKES,{

  direction:{name:"Moved the point the wrong way",tip:"Multiplying by 10, 100 or 1,000 makes the number bigger, so the point moves right. Dividing makes it smaller, so it moves left."},
  dpcount:{name:"Decimal point in the wrong place",tip:"Your digits are right! Count how many decimal places there are in the question altogether. Your answer needs that many."},
  noconvert:{name:"Forgot to change the % to a decimal",tip:"First change the percent into a decimal by moving the point 2 places left (25% = 0.25). Then multiply."},
  divmove:{name:"Didn't move both decimal points",tip:"When you move the point in the number you're dividing by, move the point in the other number the same number of places."}
});

  mul:"Not quite. Multiply the numbers as if there were no decimal points, then count the decimal places to put the point back.",
  pct:"Not quite. Change the % into a decimal first (move the point 2 places left), then multiply.",

/* ---------- worked steps for ×, ÷, % ---------- */
const mono=html=>`<div class="mono">${html}</div>`;
function pointHops(x,k,dir){ // move the decimal point k places right (dir=1) or left (dir=-1), showing each hop
  let [i,d=""]=String(x).split("."); let digits=i+d, pos=i.length, lines=[], added=0;
  const show=(ds,ps,ph)=>{ let L=ds.slice(0,ps), R=ds.slice(ps); let li=L.replace(/^0+(?=\d)/,""); if(li==="")li="0";
    const r=R.replace(/0+$/,""); return {txt:(r?li+"."+r:li), ph}; };
  lines.push(show(digits,pos,0));
  for(let h=1;h<=k;h++){
    if(dir>0){ pos++; if(pos>digits.length){digits+="0";added++;} }
    else { pos--; if(pos<0){digits="0"+digits;pos=0;added++;} }
    lines.push(show(digits,pos,added));
  }
  return {lines,added};
}
function powSteps(x,p,dir){ // x × 10^p or x ÷ 10^p
  const k=p, big=fmtN(String(10**k)), hop=pointHops(x,k,dir), word=dir>0?"right":"left";
  const steps=[];
  steps.push({tag:"Step 1 · Count the zeros",text:`<b>${big}</b> has <b>${k}</b> zero${k>1?"s":""}, so the decimal point moves <b>${k}</b> place${k>1?"s":""} to the <b>${word}</b>.`});
  steps.push({tag:"Step 2 · Move the point",text:`Move the point one place at a time.${hop.added?` When you run out of digits, add a <b>0</b> as a place holder.`:""}`,
    block:mono(hop.lines.map((l,j)=>j===0?`${l.txt}`:`→ ${fmtN(l.txt)}`).join("<br>"))});
  return steps;
}
function longMul(A,B){ // A, B digit strings (no points). Returns a lined-up working block
  const a=BigInt(A), b=BigInt(B); const bd=B.split("").reverse(); const parts=[];
  bd.forEach((c,j)=>{ if(c==="0")return; parts.push({v:a*BigInt(c)*10n**BigInt(j), lbl:`${A} × ${c}${"0".repeat(j)}`}); });
  const total=a*b, w=Math.max(total.toString().length,A.length,B.length+2)+1;
  const pad=s=>String(s).padStart(w," ");
  const h=[pad(A), pad("× "+B), "─".repeat(w)];
  if(parts.length>1){ parts.forEach(pp=>h.push(pad(pp.v)+`  <span class="lbl">(${pp.lbl})</span>`)); h.push("─".repeat(w)); }
  h.push(pad(total));
  return `<div class="mono pre">${h.join("\n")}</div>`;
}
function mulSteps(x,y){ // general decimal multiplication
  const X=P(x), Y=P(y), A=X.n.toString(), B=Y.n.toString(), dp=X.s+Y.s;
  const steps=[];
  const big=A.length>=B.length?[A,B]:[B,A];
  steps.push({tag:"Step 1 · Ignore the points",text:`Take the decimal points away for now and work out <b>${big[0]} × ${big[1]}</b>.`});
  steps.push({tag:"Step 2 · Multiply",text:`Multiply like normal whole numbers.`,block:longMul(big[0],big[1])});
  const prod=(X.n*Y.n).toString(), full=dStr({n:X.n*Y.n,s:dp}), nice=tidy(full);
  const cnt=[]; if(X.s)cnt.push(`<b>${x}</b> has ${X.s}`); if(Y.s)cnt.push(`<b>${y}</b> has ${Y.s}`);
  steps.push({tag:"Step 3 · Put the point back",text: dp
    ? `Count the decimal places: ${cnt.join(" and ")}. That's <b>${dp}</b> altogether, so count ${dp} place${dp>1?"s":""} in from the right of ${prod}: <b>${full}</b>.${full!==nice?` Zeros at the end can go: <b>${full} = ${nice}</b>.`:""}`
    : `There are no decimal places, so the answer is <b>${nice}</b>.`});
  return steps;
}
function longDiv(D,d){ // D: dividend string (may have point), d: integer string. Returns {quot, lines}
  const [ip,fp=""]=D.split("."); let digits=ip+fp; const pointAt=ip.length; const dv=BigInt(d);
  let rem=0n, q="", lines=[], started=false, i=0, extra=0;
  while(true){
    if(i>=digits.length){ if(rem===0n && i>=pointAt) break; if(extra>=4) break; digits+="0"; extra++; }
    const c=BigInt(digits[i]), cur=rem*10n+c, qd=cur/dv; rem=cur%dv;
    if(i===pointAt && q.length) q+=".";
    else if(i===pointAt) q+="0.";
    if(!started && qd===0n && i<pointAt-1){ q+="0"; i++; continue; }
    started=true; q+=qd.toString();
    lines.push(`${cur} ÷ ${d} = <b>${qd}</b>${rem?` remainder ${rem}`:""}${i+1<digits.length||rem?"":" ✓"}`);
    i++;
  }
  q=q.replace(/^0+(?=\d)/,"");
  return {quot:q,lines,stoppedEarly:rem!==0n};
}
function divSteps(a,b){
  const steps=[], B=P(b), k=B.s;
  let newA=a, newB=b;
  if(k){ const hopA=pointHops(a,k,1), hopB=pointHops(b,k,1); newA=hopA.lines[hopA.lines.length-1].txt; newB=hopB.lines[hopB.lines.length-1].txt;
    steps.push({tag:"Step 1 · Make it a whole number",text:`<b>${b}</b> has ${k} decimal place${k>1?"s":""}. Move <b>both</b> decimal points ${k} place${k>1?"s":""} to the right${hopA.added?", adding zeros if you need to":""}.`,
      block:mono(`${a} ÷ ${b}<br>→ <b>${newA} ÷ ${newB}</b>`)});
  } else steps.push({tag:"Step 1 · Check the divisor",text:`You're dividing by <b>${b}</b>, which is already a whole number, so nothing needs moving.`});
  const L=longDiv(newA,newB);
  steps.push({tag:"Step 2 · Bus-stop division",text:`Divide <b>${newA}</b> by <b>${newB}</b> one digit at a time, carrying each remainder to the next digit.`,block:mono(L.lines.join("<br>"))});
  const A=answer(a,"/",b);
  steps.push({tag:"Step 3 · Place the point",text:`Put the decimal point straight above the one in ${newA}.${A.round?` This one doesn't divide exactly, so round to 2 decimal places: <b>${A.full}</b>.`:` The answer is <b>${A.nice}</b>.`}`,
    block:mono(`&nbsp;&nbsp;&nbsp;${A.round?A.full:A.nice}<br>${newB})${newA}`)});
  return steps;
}
function buildStepsX(a,op,b){
  if(op==="/"){ const p=powOf(b); if(p){ const s=powSteps(a,p,-1); s.push({tag:"Step 3 · Answer",text:`${a} ÷ ${fmtN(b)} = <b>${answer(a,op,b).nice}</b>`}); return s; } return divSteps(a,b); }
  // multiplication (maybe with percentages)
  let steps=[], x=a, y=b;
  const conv=[];
  [a,b].forEach((t,j)=>{ if(isPct(t)){ const dec=tidy(dStr(P(t))); conv.push(`<b>${t}</b> → move the point 2 places left → <b>${dec}</b>`); if(j===0)x=dec; else y=dec; }});
  if(conv.length) steps.push({tag:"Step 1 · Percent to decimal",text:`Per cent means "out of 100", so divide by 100: ${conv.join("; ")}. Now work out <b>${fmtN(x)} × ${fmtN(y)}</b>.`});
  const p=powOf(x)||powOf(y);
  let more;
  if(p){ const other=powOf(x)?y:x; more=powSteps(other,p,1); }
  else more=mulSteps(x,y);
  more.forEach(s=>{ if(conv.length) s.tag=s.tag.replace(/Step (\d)/,(m,d)=>"Step "+(+d+1)); });
  steps=steps.concat(more);
  if(p) steps.push({tag:`Step ${steps.length+1} · Answer`,text:`${fmtN(a)} × ${fmtN(b)} = <b>${answer(a,op,b).nice}</b>`});
  return steps;
}
function drawStepsX(){
  const s=sheetById(view.sid),[n,a,op,b]=s.qs[view.i], w=view.work, steps=buildStepsX(a,op,b);
  const hintOnly=w.mode==="line";

/* ---------- extra practice for any topic ---------- */
function genQ(topic,k){
  const r2=()=>mkNum(rnd(1,3)===1?99:9,rnd(1,2));
  if(topic==="addsub"){ const op=k%2?"+":"-"; let a,b; do{ a=mkNum(op==="-"?40:30,rnd(0,2)); b=mkNum(op==="-"?9:30,rnd(1,2)); }while(op==="-"&&!(+a>+b)); return [k,a,op,b]; }
  if(topic==="mulpow"){ const p=pick(["10","100","1000"]); const x=r2(); return k%2?[k,x,"x",p]:[k,p,"x",x]; }
  if(topic==="divpow"){ return [k,mkNum(pick([9,99,999]),rnd(0,2)),"/",pick(["10","100","1000"])]; }
  if(topic==="pct"){ const pc=pick(["10%","20%","25%","50%","75%","5%","150%","200%","30%","12%"]); const x=pick(["40","60","80","120","200","4.8","12.5","300","64"]); return k%2?[k,pc,"x",x]:[k,x,"x",pc]; }
  if(topic==="mul"){ return [k,mkNum(9,rnd(1,2)),"x",mkNum(9,1)]; }
  // div: build from quotient × divisor so it divides exactly
  const dvs=pick(["2","4","5","8","1.2","2.5","0.4","3","6","1.5"]), q=mkNum(rnd(1,2)===1?9:30,rnd(1,2));
  const prod=tidy(dStr(dMul(P(q),P(dvs)))); return [k,prod,"/",dvs];
}

function vParse(s,q){
  const k=vKind(s,q), p=q[1];

    if(p.includes(" | A: ")){ const parts=p.split(" | "); return {stem:parts[0],letters:true,opts:parts.slice(1).map(x=>({val:x.slice(0,1),label:x}))}; }
    if(p.includes(" | ")){ const i=p.lastIndexOf(" | "); return {stem:p.slice(0,i),opts:vWords(p.slice(i+3)).map(w=>({val:w,label:w}))}; }

  if(k==="text") return Array.isArray(v)&&v.length===vBlanks(q)&&v.every(x=>String(x||"").trim());

}
function vCorrect(s,q,v){
  const k=vKind(s,q), ans=q[2];
  if(!vFilled(s,q,v)) return false;
  if(k==="text"){ const X=vX(q); if(X.acc) return X.acc.includes(gnorm(Array.isArray(v)?v[0]:v)); const nf=X.g?gnorm:vnorm; const a=Array.isArray(ans)?ans:[ans]; return a.length===v.length && a.every((x,i)=>nf(x)===nf(v[i])); }
  if(k==="open"){ const got=vnorm(Array.isArray(v)?v[0]:v); return ans.some(x=>vnorm(x)===got || (got.length>3&&got.includes(vnorm(x)))); }
  if(k==="write") return false;
  if(k==="pick"){ const P=vParse(s,q); const got=P.byIndex?P.opts[+v].label:v; return vnorm(got)===vnorm(ans); }
  if(k==="pick2"){ const P=vParse(s,q); const got=v.map(x=>vnorm(P.byIndex?P.opts[+x].label:x)).sort(); const want=ans.map(vnorm).sort(); return got.length===2&&got[0]===want[0]&&got[1]===want[1]; }
  if(k==="groups") return ans.every((x,i)=>vnorm(x)===vnorm(v[i]));

  return false;

async function pagesSave(pack){ const db=await pagesDB(); await new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(pack,"pack"); t.oncomplete=res; t.onerror=()=>rej(t.error); }); PAGES=pack; }
async function pagesImport(input){
  const f=input.files&&input.files[0]; if(!f)return; toast("Loading pages…");
  try{ const pack=JSON.parse(await f.text()); if(!pack.spreads||!pack.sheets) throw 0;
    await pagesSave(pack); logEvent(`Book pages added on this device (${Object.keys(pack.spreads).length} pages)`); save(); toast(`📖 ${Object.keys(pack.spreads).length} book pages added`); render(); }

}
